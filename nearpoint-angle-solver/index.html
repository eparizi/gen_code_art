<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nearpoint Angle Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  /* Layout: full-bleed GPU viewport seen like Houdini's Top view; parameter pane docked right like a parm editor, bottom sheet on phones */
  --ground:#08090c;
  --pane:rgba(23,24,28,.94);
  --field:#25272c;
  --line:#35373e;
  --ink:#e8e5dd;
  --ink-dim:#8f8c85;
  --amber:#e2a542;
  --amber-ink:#1c1406;
  --amber-wash:rgba(226,165,66,.15);
  --back:#4fa3c7;
  --both:#d9576b;
  --idle:#4d5058;
  --axis-x:#e05a4f;
  --axis-z:#4f7fe0;
  --f-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pane-w:340px;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:13px;overflow:hidden;margin:0}
#app{position:fixed;inset:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#view.dragging{cursor:grabbing}

.hud{position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:calc(100% - 32px)}
.hud h1{margin:0;font:600 15px/1.1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.hud .stats{font:400 11px/1.5 var(--f-mono);color:var(--ink-dim);font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.hud .stats b{font-weight:500;color:var(--ink)}
.hud .stats .fw{color:var(--amber)} .hud .stats .bk{color:var(--back)}

.axes{position:absolute;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;display:flex;align-items:flex-end;gap:8px;font:400 10.5px/1 var(--f-mono);color:var(--ink-dim)}
.axes svg{width:44px;height:44px;overflow:visible}

.pane{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;width:var(--pane-w);max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--pane);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.pane-head{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 12px;border-bottom:1px solid var(--line)}
.spacer{flex:1}
.pane-body{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.pane-foot{padding:9px 12px 11px;border-top:1px solid var(--line);font:400 10.5px/1.6 var(--f-mono);color:var(--ink-dim);display:flex;flex-wrap:wrap;gap:2px 10px}
.pane-foot kbd{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--field)}

.btn{font:500 12px/1 var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:7px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-dim)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:600;min-width:72px;justify-content:center}
.btn.icon{padding:6px 8px}
.btn svg{width:12px;height:12px;fill:currentColor}
.btn.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em}
.reveal{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

details.folder{border-bottom:1px solid var(--line)}
details.folder:last-child{border-bottom:0}
details.folder>summary{list-style:none;cursor:pointer;padding:10px 12px;font:600 11.5px/1 var(--f-display);letter-spacing:.17em;text-transform:uppercase;color:var(--ink-dim);display:flex;align-items:center;gap:9px;user-select:none}
details.folder>summary::-webkit-details-marker{display:none}
details.folder>summary::before{content:"";border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details.folder[open]>summary{color:var(--ink)}
details.folder[open]>summary::before{transform:rotate(90deg)}
details.folder>summary .tag{margin-left:auto;font:400 10px/1 var(--f-mono);letter-spacing:0;text-transform:none;color:var(--ink-dim)}
.folder-body{padding:0 12px 13px;display:flex;flex-direction:column;gap:8px}

.row{display:grid;grid-template-columns:104px minmax(0,1fr) 66px;align-items:center;gap:8px;min-height:24px}
.row.two{grid-template-columns:104px minmax(0,1fr)}
.row>label,.row>.lab{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>label.code,.row>.lab.code{font-family:var(--f-mono);font-size:12px;color:var(--amber)}
.row.main>label{font-weight:600}

input[type=number],select{width:100%;box-sizing:border-box;font:400 11.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:3px;padding:5px 6px}
input[type=number]{text-align:right;-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:0;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--amber) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4.5px;border-radius:50%;background:var(--ink);border:0;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--amber)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:0}

.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:0}
.seg button{flex:1;min-width:0;font:500 11.5px/1 var(--f-body);padding:6px 4px;background:var(--field);color:var(--ink-dim);border:0;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--amber-wash);color:var(--amber)}
.seg button:focus-visible{outline-offset:-2px}

.ramp{height:9px;border-radius:2px;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink-dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

.formula{margin:0;font:400 11px/1.65 var(--f-mono);color:var(--ink-dim);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:4px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.formula em{font-style:normal;color:var(--amber)}
.formula .fw{color:var(--amber)} .formula .bk{color:var(--back)}
.note{font-size:11.5px;line-height:1.45;color:var(--ink-dim)}
.note.warn{color:var(--both)}

.sheet{width:100%;border-collapse:collapse;font:400 11.5px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.sheet th,.sheet td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.sheet th:first-child,.sheet td:first-child{text-align:left;color:var(--amber)}
.sheet thead th{font:600 10px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.sheet tr:last-child td{border-bottom:0}
.sheet-wrap{overflow-x:auto}

.code-sheet{position:absolute;left:16px;top:calc(78px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));right:calc(var(--pane-w) + 32px);display:flex;flex-direction:column;background:var(--pane);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.45);min-width:0}
#app.pane-hidden .code-sheet{right:16px}
.code-head{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.code-head .seg{flex:0 1 330px}
.code-note{margin:0;padding:9px 14px;font-size:12px;line-height:1.45;color:var(--ink-dim);border-bottom:1px solid var(--line);max-width:80ch}
pre.code{margin:0;flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;font:400 11.5px/1.6 var(--f-mono);color:var(--ink);white-space:pre;tab-size:2}
pre.code .cm{color:#c99a52}

.fatal{position:absolute;inset:0;display:grid;place-items:center;padding:24px 16px;background:var(--ground)}
.fatal div{max-width:440px;font-size:14px;line-height:1.55;color:var(--ink)}
.fatal h2{margin:0 0 8px;font:600 16px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}

@media (max-width:640px){
  .pane{top:auto;left:16px;right:16px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:54%}
  .row{grid-template-columns:96px minmax(0,1fr) 60px}
  .row.two{grid-template-columns:96px minmax(0,1fr)}
  .pane-foot{display:none}
  .code-sheet,#app.pane-hidden .code-sheet{right:16px;top:calc(56px + env(safe-area-inset-top,0px))}
  .axes{display:none}
}
@media (prefers-reduced-motion:reduce){details.folder>summary::before{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="Particle view, seen like Houdini's Top view: X to the right, Z down"></canvas>

  <div class="hud">
    <h1>Nearpoint Angle Solver</h1>
    <div class="stats" id="stats">starting…</div>
  </div>

  <div class="axes" aria-hidden="true">
    <svg viewBox="0 0 44 44"><path d="M4 4H38" stroke="var(--axis-x)" stroke-width="2" fill="none"/><path d="M38 0l6 4-6 4z" fill="var(--axis-x)"/><path d="M4 4V38" stroke="var(--axis-z)" stroke-width="2" fill="none"/><path d="M0 38l4 6 4-6z" fill="var(--axis-z)"/><circle cx="4" cy="4" r="2.5" fill="var(--ink)"/></svg>
    <span>X →&nbsp; Z ↓&nbsp; top view</span>
  </div>

  <aside class="pane" id="pane" aria-label="Simulation parameters">
    <div class="pane-head">
      <button class="btn primary" id="play" type="button"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg><span>Pause</span></button>
      <button class="btn" id="stepBtn" type="button" title="One solver step (.)">Step</button>
      <button class="btn" id="resetBtn" type="button" title="Back to the grid (R)">Reset</button>
      <span class="spacer"></span>
      <button class="btn mono" id="codeBtn" type="button" title="Show the GLSL (G)" aria-expanded="false">GLSL</button>
      <button class="btn icon" id="fitBtn" type="button" title="Fit view (F)">Fit</button>
      <button class="btn icon" id="hideBtn" type="button" title="Hide parameters (H)" aria-label="Hide parameters"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.3 1.2 6 4.9l3.7-3.7 1.1 1.1L7.1 6l3.7 3.7-1.1 1.1L6 7.1l-3.7 3.7-1.1-1.1L4.9 6 1.2 2.3z"/></svg></button>
    </div>
    <div class="pane-body" id="params"></div>
    <div class="pane-foot">
      <span><kbd>Space</kbd> play</span><span><kbd>.</kbd> step</span><span><kbd>R</kbd> reset</span><span><kbd>G</kbd> GLSL</span><span><kbd>H</kbd> hide</span><span><kbd>F</kbd> fit</span>
      <span>drag to pan · wheel to zoom · click a point to inspect it</span>
    </div>
  </aside>
  <button class="btn reveal" id="revealBtn" type="button" hidden>Parameters</button>

  <section class="code-sheet" id="codeSheet" hidden aria-label="GLSL source">
    <div class="code-head">
      <div class="seg" id="codeTabs" role="group" aria-label="Shader"></div>
      <span class="spacer"></span>
      <button class="btn" id="copyBtn" type="button">Copy</button>
      <button class="btn icon" id="codeClose" type="button" aria-label="Close GLSL"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.3 1.2 6 4.9l3.7-3.7 1.1 1.1L7.1 6l3.7 3.7-1.1 1.1L6 7.1l-3.7 3.7-1.1-1.1L4.9 6 1.2 2.3z"/></svg></button>
    </div>
    <p class="code-note" id="codeNote"></p>
    <pre class="code" id="codeText" tabindex="0"></pre>
  </section>

  <div class="fatal" id="fatal" hidden><div><h2>Can't start the simulation</h2><p id="fatalMsg"></p></div></div>
</div>

<script>
'use strict';
(() => {
const $ = s => document.querySelector(s);
const canvas = $('#view');
function fatal(msg){ $('#fatal').hidden = false; $('#fatalMsg').textContent = msg; }

const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:false, stencil:false, premultipliedAlpha:false, powerPreference:'high-performance' });
if (!gl) { fatal('This browser has WebGL2 turned off or unavailable. Current Chrome, Edge, Firefox and Safari (15+) all support it; check that hardware acceleration is on.'); return; }
if (!gl.getExtension('EXT_color_buffer_float')) { fatal('This GPU/browser cannot render to floating-point textures (EXT_color_buffer_float), which the solver needs to hold P and N. Try a desktop browser with hardware acceleration on.'); return; }

/* ------------------------------------------------------------------ parameters (defaults = the VEX) */
const P = {
  playing: true,
  angle: 70,            // if(angle>70)
  count: 100000,        // grid points (rounded to a square grid)
  speed: 1,             // solver steps per displayed frame
  low: 45.2,            // if(angle<45.2)
  radius: 0.6,          // nearpoints(0, @P, .6, 2)
  lerpHigh: 0.032,      // lerp(@N, nN, 0.032)
  lerpLow: 0.0325,      // lerp(@N, nN, 0.0325)
  move: 0.008,          // @P -= / += @N*0.008
  lone: 'vex',          // nothing in radius: 'vex' = copy point 0's N, 'keep' = leave the point alone
  size: 10, seed: 0,    // Grid SOP size (Houdini default 10), random seed for N
  draw: 'points', colorBy: 'dir', pointSize: 1.5, nLen: 0.02, opacity: 0.6, trails: 0,
  marker: 'off',
};
const BG = '#07080b';
const RAMP_STOPS = ['#f0b04a','#e0605a','#8a63d2','#3d8fd6','#3fbfa0'];   // cyclic: wraps back to the first
const RULE_COL = { fwd: '#e2a542', back: '#4fa3c7', both: '#d9576b', idle: '#4d5058' };

/* ------------------------------------------------------------------ GL helpers */
const HDR = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
`;
const VS_QUAD = HDR + `void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }`;

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { const log = gl.getShaderInfoLog(s); console.error(src); throw new Error(log); }
  return s;
}
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = { loc: gl.getUniformLocation(p, info.name), type: info.type }; }
  return { p, u };
}
function setUniforms(prog, U){
  let unit = 0;
  for (const k in U) {
    const u = prog.u[k]; if (!u) continue; const v = U[k];
    switch (u.type) {
      case gl.SAMPLER_2D: gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, v); gl.uniform1i(u.loc, unit++); break;
      case gl.INT: case gl.BOOL: gl.uniform1i(u.loc, v); break;
      case gl.FLOAT: gl.uniform1f(u.loc, v); break;
      case gl.FLOAT_VEC2: gl.uniform2fv(u.loc, v); break;
      case gl.FLOAT_VEC3: gl.uniform3fv(u.loc, v); break;
      case gl.FLOAT_VEC4: gl.uniform4fv(u.loc, v); break;
      case gl.INT_VEC2: gl.uniform2iv(u.loc, v); break;
    }
  }
}
const vao = gl.createVertexArray();
function run(prog, fbo, w, h, U, mode = gl.TRIANGLES, n = 3){
  gl.useProgram(prog.p); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, w, h);
  setUniforms(prog, U); gl.bindVertexArray(vao); gl.drawArrays(mode, 0, n);
}
const FMT = {
  rgba32f: [gl.RGBA32F, gl.RGBA, gl.FLOAT],
  rg32f:   [gl.RG32F,   gl.RG,   gl.FLOAT],
  rgba16f: [gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT],
  rgba8:   [gl.RGBA8,   gl.RGBA, gl.UNSIGNED_BYTE],
};
function texture(w, h, fmt, data = null, filter = gl.NEAREST, wrap = gl.CLAMP_TO_EDGE){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  const [i, f, ty] = FMT[fmt];
  gl.texImage2D(gl.TEXTURE_2D, 0, i, w, h, 0, f, ty, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function framebuffer(...texs){
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  texs.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
  gl.drawBuffers(texs.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if (st !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer incomplete: 0x' + st.toString(16));
  return f;
}
const readFbo = gl.createFramebuffer();
function readTex(t, x, y, w, h){
  gl.bindFramebuffer(gl.FRAMEBUFFER, readFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const out = new Float32Array(w * h * 4);
  gl.readPixels(x, y, w, h, gl.RGBA, gl.FLOAT, out);
  return out;
}

/* ------------------------------------------------------------------ shaders */
// Emit: runs once at the start and on Reset.
const FS_INIT = `
// Emit: one fragment per point. Runs once when the sim starts (and on Reset).
// Points live in the XZ plane at y = 0, so state is stored 2D: (P.x, P.z, N.x, N.z).
uniform int uCount, uTexW, uCols, uRows, uSeed;
uniform float uSize;
layout(location=0) out vec4 oState;
layout(location=1) out vec4 oInfo;

uint hash(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float rand01(uint x){ return float(hash(x) >> 8) * (1.0 / 16777216.0); }   // 0 <= r < 1, like VEX rand()

void main(){
  ivec2 fc = ivec2(gl_FragCoord.xy);
  int ptnum = fc.y * uTexW + fc.x;
  if (ptnum >= uCount) { oState = vec4(0.0); oInfo = vec4(0.0); return; }

  // Grid in the XZ plane like a Grid SOP: cols along X, rows along Z, centred on the origin
  int col = ptnum % uCols, row = ptnum / uCols;
  vec2 P = (vec2(col, row) / vec2(uCols - 1, uRows - 1) - 0.5) * uSize;    // (P.x, P.z)

  // @N = fit01(rand(@ptnum), -{1,1,1}, {1,1,1});
  uint s = uint(ptnum) * 3u + uint(uSeed) * 0x9e3779b9u;
  vec3 N = mix(vec3(-1.0), vec3(1.0), vec3(rand01(s), rand01(s + 1u), rand01(s + 2u)));
  // @N.y = 0;
  N.y = 0.0;
  // @N = normalize(@N);
  N = length(N) > 0.0 ? normalize(N) : vec3(0.0);

  oState = vec4(P, N.x, N.z);
  oInfo = vec4(0.0);
}`;

// Shared by the bucket pass and the step: which grid cell a position falls in, and its hash bucket.
const COMMON = `
uniform float uH;        // cell size of the search grid
uniform int uTabMask;    // bucket count - 1 (power of two)
ivec2 at(int k, int w, int sh){ return ivec2(k & (w - 1), k >> sh); }      // 1D index -> texel
ivec2 cellOf(vec2 p){ return ivec2(floor(clamp(p / uH, vec2(-1e9), vec2(1e9)))) + 1073741824; }
int bucketOf(ivec2 c){                                                    // infinite grid, hashed into a fixed table
  uint h = uint(c.x) * 73856093u ^ uint(c.y) * 19349663u;
  h ^= h >> 16; h *= 0x7feb352du; h ^= h >> 15; h *= 0x846ca68bu; h ^= h >> 16;
  return int(h & uint(uTabMask));
}
ivec2 ringCell(int k, int j){                                             // j-th cell on the square ring at distance k
  if (k == 0) return ivec2(0);
  int side = j / (2 * k), t = j - side * 2 * k;
  if (side == 0) return ivec2(-k + t, -k);
  if (side == 1) return ivec2(k, -k + t);
  if (side == 2) return ivec2(k - t, k);
  return ivec2(-k, k - t);
}
`;

// The wrangle, run on every point each step. All points read the previous step, like a SOP solver.
const FS_SIM = `
// One solver step: the wrangle, run on every point. Every point reads the previous
// step's geometry and writes the next one, the same as an Attribute Wrangle in a SOP Solver.
#define MAXRING 64
#define MAXVISIT 65536
uniform sampler2D uState;    // (P.x, P.z, N.x, N.z) by ptnum: input 0
uniform sampler2D uSorted;   // the same data, sorted by grid bucket
uniform sampler2D uKeys;     // (bucket, ptnum) in sorted order
uniform sampler2D uRange;    // per bucket: [start, end) in the sorted list
uniform int uCount, uTexW, uTexShift, uTabW, uTabShift, uRings, uApply, uLone;
uniform float uRadius, uAngleHi, uAngleLo, uLerpHi, uLerpLo, uMove;
layout(location=0) out vec4 oState;
layout(location=1) out vec4 oInfo;   // angle, branch (1 = >hi, 2 = <lo, 3 = both), npt, distance (-1 = nothing in radius)

vec2 safeNormalize(vec2 v){ float l = length(v); return l > 0.0 ? v / l : vec2(0.0); }   // VEX normalize(0) = 0

void main(){
  ivec2 fc = ivec2(gl_FragCoord.xy);
  int ptnum = fc.y * uTexW + fc.x;
  if (ptnum >= uCount) { oState = vec4(0.0); oInfo = vec4(0.0); return; }
  vec4 me = texelFetch(uState, fc, 0);
  vec2 P = me.xy, N = me.zw;            // .y of these vec2s is the Z component

  // int npt = nearpoints(0, @P, .6, 2)[1];
  // Nearest other point within the radius: search grid cells in growing square rings
  // and stop once no unvisited cell can hold anything closer.
  ivec2 c = cellOf(P);
  float best = uRadius * uRadius;
  int bestS = -1, visits = 0;
  for (int k = 0; k <= MAXRING; k++) {
    if (k > uRings) break;
    int cells = k == 0 ? 1 : 8 * k;
    for (int j = 0; j < cells; j++) {
      vec2 se = texelFetch(uRange, at(bucketOf(c + ringCell(k, j)), uTabW, uTabShift), 0).xy;
      int s0 = int(se.x), s1 = int(se.y);
      visits += s1 - s0;
      for (int s = s0; s < s1; s++) {
        vec2 d = texelFetch(uSorted, at(s, uTexW, uTexShift), 0).xy - P;
        float d2 = dot(d, d);
        if (d2 < best || (bestS < 0 && d2 <= best)) {
          if (d2 == 0.0 && int(texelFetch(uKeys, at(s, uTexW, uTexShift), 0).y) == ptnum) continue;  // itself, nearpoints()[0]
          best = d2; bestS = s;
        }
      }
    }
    float reach = float(k) * uH;        // every unvisited point is at least this far away
    if ((bestS >= 0 && best <= reach * reach) || reach >= uRadius || visits > MAXVISIT) break;
  }

  int npt;
  vec2 nN;
  if (bestS >= 0) {
    npt = int(texelFetch(uKeys, at(bestS, uTexW, uTexShift), 0).y);
    // vector nN = point(0, "N", npt);
    nN = texelFetch(uSorted, at(bestS, uTexW, uTexShift), 0).zw;
  } else if (uLone == 0) {
    // Nothing within the radius: nearpoints() returns only this point, [1] reads past the
    // end of the array and VEX returns 0 for that, so npt = 0 and nN is point 0's N.
    npt = 0;
    nN = texelFetch(uState, ivec2(0), 0).zw;
  } else {
    oState = me;
    oInfo = vec4(-1.0, 0.0, -1.0, -1.0);
    return;
  }

  // float x1 = @N.x; float x2 = nN.x; float y1 = @N.z; float y2 = nN.z;
  float x1 = N.x, x2 = nN.x, y1 = N.y, y2 = nN.y;
  // float dot = x1*x2 + y1*y2;
  float dt = x1 * x2 + y1 * y2;
  // float det = x1*y2 - y1*x2;
  float det = x1 * y2 - y1 * x2;
  // float angle = degrees(atan2(det, dot));
  float angle = (dt == 0.0 && det == 0.0) ? 0.0 : degrees(atan(det, dt));
  // angle %= 180.;   VEX % takes the sign of 180, like GLSL mod(): -10 becomes 170
  angle = mod(angle, 180.0);

  int branch = 0;
  // if(angle>70){ @N=lerp(@N,nN,0.032); @N=normalize(@N); @P-=@N*0.008; }
  if (angle > uAngleHi) { N = safeNormalize(mix(N, nN, uLerpHi)); P -= N * uMove; branch |= 1; }
  // if(angle<45.2){ @N=lerp(@N,nN,0.0325); @N=normalize(@N); @P+=@N*0.008; }
  if (angle < uAngleLo) { N = safeNormalize(mix(N, nN, uLerpLo)); P += N * uMove; branch |= 2; }
  // @N = normalize(@N);
  N = safeNormalize(N);

  oState = uApply == 1 ? vec4(P, N) : me;
  oInfo = vec4(angle, float(branch), float(npt), bestS >= 0 ? sqrt(best) : -1.0);
}`;

// Neighbour grid, rebuilt before every step.
const FS_KEY = `
// Pass 1: bucket key of each point (padding slots get a huge key so they sort last)
uniform sampler2D uState; uniform int uCount, uTexW;
out vec4 o;
void main(){
  ivec2 fc = ivec2(gl_FragCoord.xy); int i = fc.y * uTexW + fc.x;
  if (i >= uCount) { o = vec4(1e30, float(i), 0.0, 0.0); return; }
  vec2 p = texelFetch(uState, fc, 0).xy;
  o = vec4(float(bucketOf(cellOf(p))), float(i), 0.0, 0.0);
}`;
const FS_SORT = `
// Pass 2: one bitonic merge step on (bucket, ptnum) pairs; run log2(n)*(log2(n)+1)/2 times
uniform sampler2D uKeys; uniform int uK, uJ, uTexW, uTexShift;
out vec4 o;
void main(){
  ivec2 fc = ivec2(gl_FragCoord.xy); int i = fc.y * uTexW + fc.x; int p = i ^ uJ;
  vec2 a = texelFetch(uKeys, fc, 0).xy;
  vec2 b = texelFetch(uKeys, ivec2(p & (uTexW - 1), p >> uTexShift), 0).xy;
  bool aLess = a.x < b.x || (a.x == b.x && a.y < b.y);
  bool keepMin = ((i & uK) == 0) == (i < p);
  o = vec4(keepMin ? (aLess ? a : b) : (aLess ? b : a), 0.0, 0.0);
}`;
const FS_RANGE = `
// Pass 3: for every bucket, where it starts and ends in the sorted list (binary search)
uniform sampler2D uKeys; uniform int uCount, uTexW, uTexShift, uTabW;
out vec4 o;
int lowerBound(float b, int lo){
  int hi = uCount;
  while (lo < hi) { int m = (lo + hi) >> 1; if (texelFetch(uKeys, at(m, uTexW, uTexShift), 0).x < b) lo = m + 1; else hi = m; }
  return lo;
}
void main(){
  ivec2 fc = ivec2(gl_FragCoord.xy); float b = float(fc.y * uTabW + fc.x);
  int s = lowerBound(b, 0); int e = lowerBound(b + 1.0, s);
  o = vec4(float(s), float(e), 0.0, 0.0);
}`;
const FS_REORDER = `
// Pass 4: copy P and N into sorted order so points in one bucket sit next to each other
uniform sampler2D uKeys, uState; uniform int uTexW, uTexShift;
out vec4 o;
void main(){
  int i = int(texelFetch(uKeys, ivec2(gl_FragCoord.xy), 0).y);
  o = texelFetch(uState, at(i, uTexW, uTexShift), 0);
}`;

// Stats: counts of each branch, 2x2 reduction down to one texel
const FS_REDUCE = HDR + `
uniform sampler2D uSrc; uniform ivec2 uSrcSize; uniform int uFirst, uCount, uTexW;
out vec4 o;
void main(){
  ivec2 fc = ivec2(gl_FragCoord.xy); vec4 sum = vec4(0.0);
  for (int y = 0; y < 2; y++) for (int x = 0; x < 2; x++) {
    ivec2 s = fc * 2 + ivec2(x, y);
    if (s.x >= uSrcSize.x || s.y >= uSrcSize.y) continue;
    if (uFirst == 1) {
      if (s.y * uTexW + s.x >= uCount) continue;
      vec4 inf = texelFetch(uSrc, s, 0); int f = int(inf.y + 0.5);
      sum += vec4((f & 2) != 0 ? 1.0 : 0.0, (f & 1) != 0 ? 1.0 : 0.0, f == 0 ? 1.0 : 0.0, inf.w < 0.0 ? 1.0 : 0.0);
    } else sum += texelFetch(uSrc, s, 0);
  }
  o = sum;
}`;

// Drawing: Houdini Top view, X right and Z down
const VS_POINTS = HDR + `
uniform sampler2D uState, uInfo, uRamp;
uniform int uTexW, uTexShift, uColorBy, uLines;
uniform vec2 uCam, uScale;
uniform float uPointSize, uNLen;
uniform vec3 uFwd, uBack, uBoth, uIdle;
out vec3 vCol;
void main(){
  int id = uLines == 1 ? (gl_VertexID >> 1) : gl_VertexID;
  ivec2 t = ivec2(id & (uTexW - 1), id >> uTexShift);
  vec4 s = texelFetch(uState, t, 0);
  vec4 inf = texelFetch(uInfo, t, 0);
  vec3 col;
  if (uColorBy == 0) col = texture(uRamp, vec2(atan(s.w, s.z) * 0.15915494 + 0.5, 0.5)).rgb;
  else if (uColorBy == 1) { int f = int(inf.y + 0.5); col = f == 2 ? uFwd : f == 1 ? uBack : f == 3 ? uBoth : uIdle; }
  else col = inf.x < 0.0 ? uIdle : texture(uRamp, vec2(inf.x / 180.0, 0.5)).rgb;
  vec2 p = s.xy;
  if (uLines == 1 && (gl_VertexID & 1) == 1) p += s.zw * uNLen;
  gl_Position = vec4((p.x - uCam.x) * uScale.x, -(p.y - uCam.y) * uScale.y, 0.0, 1.0);
  gl_PointSize = uPointSize;
  vCol = col;
}`;
const FS_POINTS = HDR + `
in vec3 vCol; uniform float uOpacity; uniform int uRound; out vec4 o;
void main(){
  if (uRound == 1) { vec2 q = gl_PointCoord * 2.0 - 1.0; if (dot(q, q) > 1.0) discard; }
  o = vec4(vCol * uOpacity, uOpacity);
}`;
const VS_MARK = HDR + `
uniform sampler2D uState; uniform int uId, uTexW, uTexShift; uniform vec2 uCam, uScale; uniform float uSize;
void main(){
  vec4 s = texelFetch(uState, ivec2(uId & (uTexW - 1), uId >> uTexShift), 0);
  gl_Position = vec4((s.x - uCam.x) * uScale.x, -(s.y - uCam.y) * uScale.y, 0.0, 1.0); gl_PointSize = uSize;
}`;
const FS_MARK = HDR + `
uniform vec3 uColor; out vec4 o;
void main(){
  float r = length(gl_PointCoord * 2.0 - 1.0);
  float ring = smoothstep(0.58, 0.68, r) * (1.0 - smoothstep(0.84, 0.96, r));
  float halo = smoothstep(0.44, 0.56, r) * (1.0 - smoothstep(0.98, 1.0, r));
  vec4 c = mix(vec4(0.0, 0.0, 0.0, 0.55 * halo), vec4(uColor, 1.0), ring);
  if (c.a < 0.01) discard;
  o = c;
}`;
const FS_FADE = HDR + `uniform vec4 uColor; out vec4 o; void main(){ o = uColor; }`;
const FS_BLIT = HDR + `uniform sampler2D uSrc; out vec4 o; void main(){ o = vec4(texelFetch(uSrc, ivec2(gl_FragCoord.xy), 0).rgb, 1.0); }`;

let PR;
try {
  PR = {
    init: program(VS_QUAD, HDR + FS_INIT),
    key: program(VS_QUAD, HDR + COMMON + FS_KEY), sort: program(VS_QUAD, HDR + FS_SORT),
    range: program(VS_QUAD, HDR + COMMON + FS_RANGE), reorder: program(VS_QUAD, HDR + COMMON + FS_REORDER),
    sim: program(VS_QUAD, HDR + COMMON + FS_SIM), reduce: program(VS_QUAD, FS_REDUCE),
    points: program(VS_POINTS, FS_POINTS), mark: program(VS_MARK, FS_MARK),
    fade: program(VS_QUAD, FS_FADE), blit: program(VS_QUAD, FS_BLIT),
  };
} catch (e) { fatal('A shader failed to compile on this GPU: ' + e.message); return; }

/* ------------------------------------------------------------------ simulation state */
const S = {
  count: 0, cols: 0, rows: 0, size: 10, total: 0, texW: 0, texH: 0, shift: 0,
  tabW: 0, tabH: 0, tabSize: 0, h: 0.04, rings: 1,
  cur: 0, frame: 0, acc: 0,
  state: [], info: null, keys: [], keysFbo: [], simFbo: [], sorted: null, sortedFbo: null, range: null, rangeFbo: null,
  reduce: [], counts: null, stats: [0, 0, 0, 0],
  frameTex: null, frameFbo: null, fw: 0, fh: 0,
  ramp: null, needClear: true, infoDirty: false,
};
const nextPow2 = n => { let p = 1; while (p < n) p <<= 1; return p; };
const del = list => list.forEach(o => { if (!o) return; if (o instanceof WebGLTexture) gl.deleteTexture(o); else gl.deleteFramebuffer(o); });

function allocParticles(total){
  del([...S.state, S.info, ...S.keys, ...S.keysFbo, ...S.simFbo, S.sorted, S.sortedFbo, S.range, S.rangeFbo, ...S.reduce.flatMap(l => [l.tex, l.fbo])]);
  const shift = Math.ceil(Math.log2(total) / 2), texW = 1 << shift, texH = total / texW;
  Object.assign(S, { total, texW, texH, shift, tabW: texW, tabH: texH * 2, tabSize: total * 2 });
  S.state = [texture(texW, texH, 'rgba32f'), texture(texW, texH, 'rgba32f')];
  S.info = texture(texW, texH, 'rgba32f');
  S.keys = [texture(texW, texH, 'rg32f'), texture(texW, texH, 'rg32f')];
  S.keysFbo = S.keys.map(t => framebuffer(t));
  S.simFbo = [0, 1].map(j => framebuffer(S.state[j], S.info));
  S.sorted = texture(texW, texH, 'rgba32f'); S.sortedFbo = framebuffer(S.sorted);
  S.range = texture(S.tabW, S.tabH, 'rg32f'); S.rangeFbo = framebuffer(S.range);
  S.reduce = [];
  let w = texW, h = texH;
  while (w > 1 || h > 1) {
    w = Math.max(1, Math.ceil(w / 2)); h = Math.max(1, Math.ceil(h / 2));
    const t = texture(w, h, 'rgba32f'); S.reduce.push({ tex: t, fbo: framebuffer(t), w, h });
  }
  S.counts = S.reduce[S.reduce.length - 1].tex;
}

// Search-grid cell: a bit over the starting point spacing, never so small that the radius needs more than 48 rings
function updateSearchGrid(){
  const spacing = S.size / Math.max(1, S.cols - 1);
  S.h = Math.max(spacing * 1.25, P.radius / 48, 1e-5);
  S.rings = Math.min(64, Math.ceil(P.radius / S.h));
}

function emit(){
  const side = Math.max(4, Math.min(1024, Math.round(Math.sqrt(P.count))));
  const count = side * side;
  const total = nextPow2(Math.max(count, 64));
  if (total !== S.total) allocParticles(total);
  const sizeChanged = S.size !== P.size;
  Object.assign(S, { count, cols: side, rows: side, size: P.size, cur: 0, frame: 0, acc: 0 });
  updateSearchGrid();
  gl.disable(gl.BLEND);
  run(PR.init, S.simFbo[0], S.texW, S.texH, { uCount: count, uTexW: S.texW, uCols: side, uRows: side, uSeed: P.seed | 0, uSize: P.size });
  if (inspectId >= count) inspectId = 0;
  S.needClear = true;
  solve(false);            // which branch each point takes on the grid, without moving anything
  return sizeChanged;
}

function solve(apply){
  const { texW, texH, shift, count, total } = S;
  const common = { uH: S.h, uTabMask: S.tabSize - 1 };
  gl.disable(gl.BLEND);
  // neighbour grid: bucket, sort, bucket ranges, sorted copy of P and N
  run(PR.key, S.keysFbo[0], texW, texH, { ...common, uState: S.state[S.cur], uCount: count, uTexW: texW });
  let src = 0;
  for (let k = 2; k <= total; k <<= 1)
    for (let j = k >> 1; j > 0; j >>= 1) {
      run(PR.sort, S.keysFbo[1 - src], texW, texH, { uKeys: S.keys[src], uK: k, uJ: j, uTexW: texW, uTexShift: shift });
      src = 1 - src;
    }
  const keys = S.keys[src];
  run(PR.range, S.rangeFbo, S.tabW, S.tabH, { ...common, uKeys: keys, uCount: count, uTexW: texW, uTexShift: shift, uTabW: S.tabW });
  run(PR.reorder, S.sortedFbo, texW, texH, { ...common, uKeys: keys, uState: S.state[S.cur], uTexW: texW, uTexShift: shift });

  // the wrangle
  const nxt = 1 - S.cur;
  run(PR.sim, S.simFbo[nxt], texW, texH, {
    ...common, uState: S.state[S.cur], uSorted: S.sorted, uKeys: keys, uRange: S.range,
    uCount: count, uTexW: texW, uTexShift: shift, uTabW: S.tabW, uTabShift: shift, uRings: S.rings,
    uApply: apply ? 1 : 0, uLone: P.lone === 'vex' ? 0 : 1,
    uRadius: P.radius, uAngleHi: P.angle, uAngleLo: P.low, uLerpHi: P.lerpHigh, uLerpLo: P.lerpLow, uMove: P.move,
  });
  S.cur = nxt;
  if (apply) S.frame++;

  // branch counts
  let s = S.info, sw = texW, sh = texH, first = 1;
  for (const l of S.reduce) {
    run(PR.reduce, l.fbo, l.w, l.h, { uSrc: s, uSrcSize: [sw, sh], uFirst: first, uCount: count, uTexW: texW });
    s = l.tex; sw = l.w; sh = l.h; first = 0;
  }
  S.infoDirty = false;
}

/* ------------------------------------------------------------------ colour */
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const hex01 = h => hexRgb(h).map(v => v / 255);
function buildRamp(){
  const stops = RAMP_STOPS.map(hexRgb), n = stops.length, data = new Uint8Array(256 * 4);
  for (let i = 0; i < 256; i++) {
    const t = i / 256 * n, k = Math.floor(t), f = t - k, a = stops[k % n], b = stops[(k + 1) % n];
    for (let c = 0; c < 3; c++) data[i*4+c] = Math.round(a[c] * (1 - f) + b[c] * f);
    data[i*4+3] = 255;
  }
  S.ramp = texture(256, 1, 'rgba8', data, gl.LINEAR, gl.REPEAT);
}

/* ------------------------------------------------------------------ camera + drawing */
const cam = { x: 0, y: 0, ppu: 1 };   // centre in world (x, z); device pixels per unit
let dpr = 1;
function paneInset(){
  const pane = $('#pane'); if (pane.hidden) return [0, 0];
  const r = pane.getBoundingClientRect(), c = canvas.getBoundingClientRect();
  return r.width < c.width * 0.6 ? [Math.max(0, c.right - r.left), 0] : [0, Math.max(0, c.bottom - r.top)];
}
function fitView(){
  const [ox, oy] = paneInset();
  const fw = Math.max(120, canvas.clientWidth - ox), fh = Math.max(120, canvas.clientHeight - oy - 40);
  cam.ppu = Math.min(fw, fh) * 0.9 / S.size * dpr;
  cam.x = ox * dpr / 2 / cam.ppu; cam.y = (oy - 40) * dpr / 2 / cam.ppu;
  S.needClear = true;
}
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (w === S.fw && h === S.fh) return;
  canvas.width = w; canvas.height = h; S.fw = w; S.fh = h;
  del([S.frameTex, S.frameFbo]);
  S.frameTex = texture(w, h, 'rgba16f'); S.frameFbo = framebuffer(S.frameTex);
  fitView();
}
const camScale = () => [2 * cam.ppu / S.fw, 2 * cam.ppu / S.fh];
function render(){
  resize();
  const bg = hex01(BG), sc = camScale();
  if (P.trails <= 0 || S.needClear) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, S.frameFbo); gl.viewport(0, 0, S.fw, S.fh);
    gl.clearColor(bg[0], bg[1], bg[2], 1); gl.clear(gl.COLOR_BUFFER_BIT);
    S.needClear = false;
  } else {
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    run(PR.fade, S.frameFbo, S.fw, S.fh, { uColor: [bg[0], bg[1], bg[2], 1 - P.trails] });
  }
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  const lines = P.draw === 'lines', size = P.pointSize * dpr;
  run(PR.points, S.frameFbo, S.fw, S.fh, {
    uState: S.state[S.cur], uInfo: S.info, uRamp: S.ramp,
    uTexW: S.texW, uTexShift: S.shift, uColorBy: { dir: 0, rule: 1, angle: 2 }[P.colorBy], uLines: lines ? 1 : 0,
    uCam: [cam.x, cam.y], uScale: sc, uPointSize: size, uNLen: P.nLen,
    uFwd: hex01(RULE_COL.fwd), uBack: hex01(RULE_COL.back), uBoth: hex01(RULE_COL.both), uIdle: hex01(RULE_COL.idle),
    uOpacity: P.opacity, uRound: !lines && size >= 2.5 ? 1 : 0,
  }, lines ? gl.LINES : gl.POINTS, lines ? S.count * 2 : S.count);
  gl.disable(gl.BLEND);
  run(PR.blit, null, S.fw, S.fh, { uSrc: S.frameTex });
  if (P.marker === 'on' && inspectId >= 0 && inspectId < S.count) {
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    const base = { uState: S.state[S.cur], uTexW: S.texW, uTexShift: S.shift, uCam: [cam.x, cam.y], uScale: sc };
    if (inspectNpt >= 0 && inspectNpt < S.count && inspectNpt !== inspectId)
      run(PR.mark, null, S.fw, S.fh, { ...base, uId: inspectNpt, uSize: 15 * dpr, uColor: hex01('#e8e5dd') }, gl.POINTS, 1);
    run(PR.mark, null, S.fw, S.fh, { ...base, uId: inspectId, uSize: 22 * dpr, uColor: hex01(RULE_COL.fwd) }, gl.POINTS, 1);
    gl.disable(gl.BLEND);
  }
}

/* ------------------------------------------------------------------ readouts */
let inspectId = 0, inspectNpt = -1;
const fmtN = (v, d = 4) => (Math.abs(v) < 5e-5 ? 0 : v).toFixed(d);
const BRANCH = ['neither', 'angle > upper', 'angle < lower', 'both'];
function readInspect(){
  if (inspectId < 0 || inspectId >= S.count) return;
  const x = inspectId & (S.texW - 1), y = inspectId >> S.shift;
  const st = readTex(S.state[S.cur], x, y, 1, 1), inf = readTex(S.info, x, y, 1, 1);
  const set = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
  inspectNpt = inf[2] >= 0 ? Math.round(inf[2]) : -1;
  set('iv-pt', String(inspectId));
  set('iv-P', `${fmtN(st[0])}, 0, ${fmtN(st[1])}`);
  set('iv-N', `${fmtN(st[2])}, 0, ${fmtN(st[3])}`);
  set('iv-npt', inspectNpt >= 0 ? String(inspectNpt) + (inf[3] < 0 ? '  (point 0)' : '') : 'none');
  set('iv-dist', inf[3] >= 0 ? fmtN(inf[3]) : 'outside radius');
  set('iv-angle', inf[0] >= 0 ? inf[0].toFixed(2) + '°' : '–');
  set('iv-branch', BRANCH[Math.round(inf[1])] || '–');
}
function readStats(){ const c = readTex(S.counts, 0, 0, 1, 1); S.stats = [c[0], c[1], c[2], c[3]]; }

let fpsT = performance.now(), fpsN = 0, fps = 0;
const nf = new Intl.NumberFormat('en-US');
function updateHud(){
  const n = Math.max(1, S.count), pc = v => (v / n * 100).toFixed(1) + '%';
  $('#stats').innerHTML = `<b>${nf.format(S.count)}</b> pts (${S.cols}×${S.rows}) · <b>${fps.toFixed(0)}</b> fps · step <b>${nf.format(S.frame)}</b><br>` +
    `<span class="fw">&lt; ${P.low}: ${pc(S.stats[0])}</span> · <span class="bk">&gt; ${P.angle}: ${pc(S.stats[1])}</span> · neither ${pc(S.stats[2])} · lone ${nf.format(S.stats[3])}`;
}

/* ------------------------------------------------------------------ main loop */
let resetPending = false, stepOnce = false, tick = 0;
function frame(now){
  requestAnimationFrame(frame);
  let changed = false;
  if (resetPending) { resetPending = false; if (emit()) fitView(); changed = true; }
  let n = 0;
  if (P.playing) { S.acc += P.speed; n = Math.min(60, Math.floor(S.acc)); S.acc -= n; }
  else if (stepOnce) { n = 1; changed = true; }
  stepOnce = false;
  for (let i = 0; i < n; i++) solve(true);
  if (n === 0 && S.infoDirty) { solve(false); changed = true; }
  render();
  fpsN++;
  if (now - fpsT > 500) { fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; }
  if (++tick % 12 === 0 || changed) { readStats(); readInspect(); updateHud(); }
}

/* ------------------------------------------------------------------ UI */
const GROUPS = [
  { title: 'Solver', formula: true, items: [
    { k: 'angle', label: 'angle >', code: true, main: true, hint: 'The 70 in if(angle>70): above it, N turns toward the neighbour and the point steps back', min: 0, max: 180, step: 0.1, solver: true },
    { k: 'count', label: 'Particles', main: true, hint: 'Points on the grid, rounded to a square grid. Restarts the sim.', log: true, min: 1000, max: 1048576, step: 1, round: v => Math.min(1048576, +v.toPrecision(3)), hardMin: 16, hardMax: 1048576, reset: true },
    { k: 'speed', label: 'Sim speed', main: true, hint: 'Solver steps per displayed frame', log: true, min: 0.1, max: 30, step: 0.01, round: v => +v.toPrecision(2), hardMin: 0.01, hardMax: 60 },
  ]},
  { title: 'Wrangle constants', tag: 'from the VEX', closed: true, items: [
    { k: 'low', label: 'angle <', code: true, hint: 'The 45.2 in if(angle<45.2)', min: 0, max: 180, step: 0.1, solver: true },
    { k: 'radius', label: 'radius', code: true, hint: 'nearpoints(0, @P, radius, 2)', min: 0.01, max: 3, step: 0.01, hardMax: 100, solver: true, grid: true },
    { k: 'lerpHigh', label: 'Lerp above', hint: 'lerp(@N, nN, 0.032) in the angle > branch', min: 0, max: 0.5, step: 0.0001, hardMax: 1, solver: true },
    { k: 'lerpLow', label: 'Lerp below', hint: 'lerp(@N, nN, 0.0325) in the angle < branch', min: 0, max: 0.5, step: 0.0001, hardMax: 1, solver: true },
    { k: 'move', label: 'Step', hint: '@P -= / += @N*0.008', min: 0, max: 0.05, step: 0.0001, hardMax: 1, solver: true },
    { k: 'lone', label: 'Lone point', type: 'seg', solver: true, hint: 'Nothing within radius: nearpoints()[1] reads past the array end, VEX returns 0, so the point uses point 0’s N', options: [['vex', 'Use point 0 (VEX)'], ['keep', 'Leave as is']] },
  ]},
  { title: 'Grid', tag: 'restarts sim', closed: true, items: [
    { k: 'size', label: 'Grid size', hint: 'Grid SOP size in X and Z (Houdini default 10)', min: 1, max: 50, step: 0.1, hardMin: 0.01, hardMax: 1000, reset: true },
    { k: 'seed', label: 'Seed', hint: 'Seed for the random N', min: 0, max: 999, step: 1, hardMax: 1e6, reset: true },
  ]},
  { title: 'Display', items: [
    { k: 'draw', label: 'Draw', type: 'seg', options: [['points', 'Points'], ['lines', 'N as lines']] },
    { k: 'colorBy', label: 'Color by', type: 'seg', options: [['dir', '@N'], ['rule', 'Branch'], ['angle', 'angle']] },
    { type: 'ramp', showIf: () => P.colorBy !== 'rule' },
    { type: 'legend', showIf: () => P.colorBy === 'rule' },
    { k: 'pointSize', label: 'Point size', min: 0.5, max: 8, step: 0.1 },
    { k: 'nLen', label: 'N length', hint: 'Line length in world units', min: 0.001, max: 0.3, step: 0.001, showIf: () => P.draw === 'lines' },
    { k: 'opacity', label: 'Opacity', min: 0.02, max: 1, step: 0.01 },
    { k: 'trails', label: 'Trails', min: 0, max: 0.99, step: 0.01 },
  ]},
  { title: 'Inspect', tag: '@ptnum', inspect: true, closed: true, items: [
    { k: 'marker', label: 'Highlight', hint: 'Ring the inspected point and its npt', type: 'seg', options: [['off', 'Off'], ['on', 'On']] },
  ]},
];

const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k === 'html') e.innerHTML = attrs[k]; else e.setAttribute(k, attrs[k]); }
  kids.forEach(c => e.append(c)); return e;
};
const decimals = s => (String(s).split('.')[1] || '').length;
const rows = [];
function sliderFill(sl){ const p = (sl.value - sl.min) / (sl.max - sl.min) * 100; sl.style.setProperty('--p', Math.max(0, Math.min(100, p)) + '%'); }

function onChange(it, committed){
  if (it.reset) { if (committed) resetPending = true; return; }
  if (it.grid) updateSearchGrid();
  if (it.solver) { if (!P.playing) S.infoDirty = true; updateFormula(); }
  if (it.k === 'trails') S.needClear = true;
  refreshRows();
  if (it.solver) updateHud();
}

function makeRow(it){
  if (it.type === 'ramp') {
    const r = h('div', { class: 'row two' }, h('span', { class: 'lab' }, 'Ramp'), h('div', { class: 'ramp', style: `background:linear-gradient(to right,${[...RAMP_STOPS, RAMP_STOPS[0]].join(',')})` }));
    rows.push({ it, row: r }); return r;
  }
  if (it.type === 'legend') {
    const chip = (c, t) => h('span', {}, h('i', { style: `background:${c}` }), t);
    const r = h('div', { class: 'legend' }, chip(RULE_COL.fwd, 'angle < lower'), chip(RULE_COL.back, 'angle > upper'), chip(RULE_COL.both, 'both'), chip(RULE_COL.idle, 'neither'));
    rows.push({ it, row: r }); return r;
  }
  const key = it.k, id = 'p-' + it.k;
  const label = h('label', { for: id, class: it.code ? 'code' : '' }, it.label);
  if (it.hint) label.title = it.hint;
  let row;
  if (!it.type) {
    const toS = v => it.log ? Math.log10(v) : v;
    const fromS = v => it.log ? (it.round ? it.round(10 ** v) : 10 ** v) : v;
    const fmt = v => (+v).toFixed(it.log && it.k === 'count' ? 0 : decimals(it.step));
    const sl = h('input', { type: 'range', id, min: toS(it.min), max: toS(it.max), step: it.log ? 0.001 : it.step, value: toS(P[key]) });
    const num = h('input', { type: 'number', id: 'n-' + it.k, step: it.step, value: fmt(P[key]), 'aria-label': it.label + ' value' });
    if (it.hint) sl.title = it.hint;
    const lo = it.hardMin ?? it.min, hi = it.hardMax ?? it.max;
    sl.addEventListener('input', () => { P[key] = fromS(+sl.value); num.value = fmt(P[key]); sliderFill(sl); onChange(it, false); });
    sl.addEventListener('change', () => onChange(it, true));
    num.addEventListener('change', () => {
      let v = parseFloat(num.value); if (!isFinite(v)) v = P[key];
      v = Math.min(hi, Math.max(lo, v));
      P[key] = v; num.value = fmt(v); sl.value = toS(v); sliderFill(sl); onChange(it, true);
    });
    sliderFill(sl);
    row = h('div', { class: 'row' + (it.main ? ' main' : '') }, label, sl, num);
    row._sync = () => { sl.value = toS(P[key]); num.value = fmt(P[key]); sliderFill(sl); };
  } else if (it.type === 'seg') {
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': it.label });
    const btns = it.options.map(([v, t]) => {
      const b = h('button', { type: 'button', 'aria-pressed': String(P[key] === v) }, t);
      b.addEventListener('click', () => { P[key] = v; btns.forEach((x, i) => x.setAttribute('aria-pressed', String(it.options[i][0] === v))); onChange(it, true); });
      seg.append(b); return b;
    });
    row = h('div', { class: 'row two' }, h('span', { class: 'lab' + (it.code ? ' code' : ''), title: it.hint || '' }, it.label), seg);
    row._sync = () => btns.forEach((x, i) => x.setAttribute('aria-pressed', String(it.options[i][0] === P[key])));
  }
  rows.push({ it, row });
  return row;
}
function refreshRows(){ for (const { it, row } of rows) row.hidden = it.showIf ? !it.showIf() : false; }

let formulaEl, overlapEl;
function updateFormula(){
  if (!formulaEl) return;
  const n = v => String(+(+v).toFixed(4));
  formulaEl.innerHTML =
    `npt = nearpoints(0, @P, <em>${n(P.radius)}</em>, 2)[1]\n` +
    `angle = degrees(atan2(det, dot)) % 180\n` +
    `<span class="bk">angle &gt; <em>${n(P.angle)}</em></span>  N → nN by ${n(P.lerpHigh)}, P −= N·${n(P.move)}\n` +
    `<span class="fw">angle &lt; <em>${n(P.low)}</em></span>  N → nN by ${n(P.lerpLow)}, P += N·${n(P.move)}`;
  overlapEl.hidden = !(P.angle < P.low);
  overlapEl.textContent = `angle > ${n(P.angle)} is below angle < ${n(P.low)}, so between them both branches run, in the wrangle's order.`;
}

function buildUI(){
  const root = $('#params');
  for (const g of GROUPS) {
    const sum = h('summary', {}, g.title);
    if (g.tag) sum.append(h('span', { class: 'tag' }, g.tag));
    const body = h('div', { class: 'folder-body' });
    if (g.formula) {
      formulaEl = h('pre', { class: 'formula' }); overlapEl = h('div', { class: 'note warn' });
      body.append(formulaEl, overlapEl);
    }
    g.items.forEach(it => body.append(makeRow(it)));
    if (g.inspect) body.append(buildInspect());
    const d = h('details', { class: 'folder' }, sum, body);
    d.open = !g.closed;
    root.append(d);
  }
  refreshRows(); updateFormula();
}
function buildInspect(){
  const wrap = h('div', { style: 'display:flex;flex-direction:column;gap:8px' });
  const num = h('input', { type: 'number', id: 'inspectId', min: 0, step: 1, value: inspectId, 'aria-label': 'Point number to inspect' });
  num.addEventListener('change', () => { const v = Math.round(+num.value); inspectId = isFinite(v) ? Math.max(0, Math.min(S.count - 1, v)) : 0; num.value = inspectId; readInspect(); });
  wrap.append(h('div', { class: 'row two' }, h('label', { for: 'inspectId', class: 'code' }, '@ptnum'), num));
  const tb = h('tbody');
  [['@ptnum', 'iv-pt'], ['@P', 'iv-P'], ['@N', 'iv-N'], ['npt', 'iv-npt'], ['distance', 'iv-dist'], ['angle', 'iv-angle'], ['branch', 'iv-branch']]
    .forEach(([n, id]) => tb.append(h('tr', {}, h('td', {}, n), h('td', { id }, '–'))));
  wrap.append(h('div', { class: 'sheet-wrap' }, h('table', { class: 'sheet' }, h('thead', {}, h('tr', {}, h('th', {}, 'Attribute'), h('th', {}, 'Value'))), tb)));
  wrap.append(h('div', { class: 'note' }, 'Click a point in the view to inspect it. angle is after the % 180, as the wrangle tests it.'));
  return wrap;
}

/* GLSL viewer */
const CODE = [
  { id: 'step', label: 'Step', note: 'Runs every solver step, one fragment per point. This is the wrangle: nearest point within the radius, the angle, then the two branches. The VEX lines are kept as comments above their GLSL.',
    src: () => HDR + COMMON + FS_SIM },
  { id: 'emit', label: 'Emit (once)', note: 'Runs once when the sim starts and on Reset: grid positions and the random N. GPU random numbers differ from Houdini’s rand(), so the exact pattern differs; the distribution is the same.',
    src: () => HDR + FS_INIT },
  { id: 'grid', label: 'Neighbour grid', note: 'Stands in for nearpoints()’ lookup structure. Four small passes run before every step, each its own fragment shader with the same header and helpers as the Step tab: bucket each point by grid cell, sort by bucket, record where each bucket starts and ends, then copy P and N into sorted order.',
    src: () => [FS_KEY, FS_SORT, FS_RANGE, FS_REORDER].map(s => s.trim()).join('\n\n') },
];
let codeTab = 'step';
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const highlight = src => src.split('\n').map(line => { const i = line.indexOf('//'); return i < 0 ? esc(line) : esc(line.slice(0, i)) + '<span class="cm">' + esc(line.slice(i)) + '</span>'; }).join('\n');
const codeBtns = CODE.map(c => {
  const b = h('button', { type: 'button', 'aria-pressed': String(c.id === codeTab) }, c.label);
  b.addEventListener('click', () => { codeTab = c.id; showCode(); });
  $('#codeTabs').append(b); return b;
});
function showCode(){
  const c = CODE.find(x => x.id === codeTab);
  codeBtns.forEach((b, i) => b.setAttribute('aria-pressed', String(CODE[i].id === codeTab)));
  $('#codeNote').textContent = c.note;
  $('#codeText').innerHTML = highlight(c.src().trim());
  $('#codeText').scrollTop = 0;
}
function setCode(open){ $('#codeSheet').hidden = !open; $('#codeBtn').setAttribute('aria-expanded', String(open)); if (open) showCode(); }
$('#codeBtn').addEventListener('click', () => setCode($('#codeSheet').hidden));
$('#codeClose').addEventListener('click', () => setCode(false));
$('#copyBtn').addEventListener('click', () => {
  const txt = CODE.find(x => x.id === codeTab).src().trim(), btn = $('#copyBtn');
  const done = t => { btn.textContent = t; setTimeout(() => { btn.textContent = 'Copy'; }, 1400); };
  const select = () => { const r = document.createRange(); r.selectNodeContents($('#codeText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done('Selected'); };
  try { navigator.clipboard.writeText(txt).then(() => done('Copied'), select); } catch (e) { select(); }
});

/* transport */
function setPlaying(on){
  P.playing = on;
  const b = $('#play');
  b.querySelector('span').textContent = on ? 'Pause' : 'Play';
  b.querySelector('svg').innerHTML = on ? '<path d="M2 1h3v10H2zM7 1h3v10H7z"/>' : '<path d="M2 1l9 5-9 5z"/>';
}
$('#play').addEventListener('click', () => setPlaying(!P.playing));
$('#stepBtn').addEventListener('click', () => { setPlaying(false); stepOnce = true; });
$('#resetBtn').addEventListener('click', () => { resetPending = true; });
$('#fitBtn').addEventListener('click', () => fitView());
function setPane(show){ $('#pane').hidden = !show; $('#revealBtn').hidden = show; $('#app').classList.toggle('pane-hidden', !show); }
$('#hideBtn').addEventListener('click', () => setPane(false));
$('#revealBtn').addEventListener('click', () => setPane(true));

addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.key === 'Escape' && !$('#codeSheet').hidden) setCode(false);
  else if (e.code === 'Space') { e.preventDefault(); setPlaying(!P.playing); }
  else if (e.key === '.') { setPlaying(false); stepOnce = true; }
  else if (e.key === 'r' || e.key === 'R') resetPending = true;
  else if (e.key === 'h' || e.key === 'H') setPane($('#pane').hidden);
  else if (e.key === 'f' || e.key === 'F') fitView();
  else if (e.key === 'g' || e.key === 'G') setCode($('#codeSheet').hidden);
});

/* pan / zoom / pick */
let drag = null;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }; });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; canvas.classList.add('dragging'); }
  if (drag.moved) { cam.x = drag.cx - dx * dpr / cam.ppu; cam.y = drag.cy - dy * dpr / cam.ppu; S.needClear = true; }
});
canvas.addEventListener('pointerup', e => { if (drag && !drag.moved) pick(e.clientX, e.clientY); drag = null; canvas.classList.remove('dragging'); });
canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('dragging'); });
canvas.addEventListener('dblclick', fitView);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const px = (e.clientX - r.left) * dpr - S.fw / 2, py = (e.clientY - r.top) * dpr - S.fh / 2;
  const wx = cam.x + px / cam.ppu, wz = cam.y + py / cam.ppu;
  cam.ppu = Math.min(1e6, Math.max(1e-3, cam.ppu * Math.exp(-e.deltaY * 0.0015)));
  cam.x = wx - px / cam.ppu; cam.y = wz - py / cam.ppu;
  S.needClear = true;
}, { passive: false });

function pick(cx, cy){
  const r = canvas.getBoundingClientRect();
  const all = readTex(S.state[S.cur], 0, 0, S.texW, S.texH);
  let best = -1, bd = 14 * 14;
  for (let i = 0; i < S.count; i++) {
    const px = r.left + (S.fw / 2 + (all[i*4] - cam.x) * cam.ppu) / dpr;
    const py = r.top + (S.fh / 2 + (all[i*4+1] - cam.y) * cam.ppu) / dpr;
    const d = (px - cx) ** 2 + (py - cy) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0) {
    inspectId = best; const n = $('#inspectId'); if (n) n.value = best;
    if (P.marker !== 'on') { P.marker = 'on'; rows.forEach(({ it, row }) => { if (it.k === 'marker') row._sync(); }); }
    const insp = [...document.querySelectorAll('details.folder')].pop(); if (insp) insp.open = true;
    readInspect();
  }
}

/* ------------------------------------------------------------------ boot */
buildUI();
buildRamp();
if (innerWidth < 640) setPane(false);
resize();
try { emit(); } catch (e) { fatal('Could not set up the GPU buffers: ' + e.message); return; }
fitView();
readStats(); readInspect(); updateHud();
requestAnimationFrame(frame);

// handle for scripted testing from the console
window.__sim = { P, S, emit, solve, readTex, render, setPlaying, updateSearchGrid };
})();
</script>
</body>
</html>
