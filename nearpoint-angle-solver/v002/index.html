<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nearpoint Angle Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  /* Layout: full-bleed GPU viewport seen like Houdini's Top view; parameter pane docked right like a parm editor, bottom sheet on phones */
  --ground:#08090c;
  --pane:rgba(23,24,28,.94);
  --field:#25272c;
  --line:#35373e;
  --ink:#e8e5dd;
  --ink-dim:#8f8c85;
  --amber:#e2a542;
  --amber-ink:#1c1406;
  --amber-wash:rgba(226,165,66,.15);
  --back:#4fa3c7;
  --both:#d9576b;
  --idle:#4d5058;
  --axis-x:#e05a4f;
  --axis-z:#4f7fe0;
  --f-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pane-w:340px;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:13px;overflow:hidden;margin:0}
#app{position:fixed;inset:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#view.dragging{cursor:grabbing}

.hud{position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:calc(100% - 32px)}
.hud h1{margin:0;font:600 15px/1.1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.hud .stats{font:400 11px/1.5 var(--f-mono);color:var(--ink-dim);font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.hud .stats b{font-weight:500;color:var(--ink)}
.hud .stats .fw{color:var(--amber)} .hud .stats .bk{color:var(--back)}

.axes{position:absolute;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;display:flex;align-items:flex-end;gap:8px;font:400 10.5px/1 var(--f-mono);color:var(--ink-dim)}
.axes svg{width:44px;height:44px;overflow:visible}

/* Invert: the view turns off-white, so the overlay text goes dark */
#app.inverted .hud h1{color:#141413;text-shadow:0 1px 2px rgba(255,255,255,.7)}
#app.inverted .hud h1 .ver{color:#9a6512}
#app.inverted .hud .stats{color:#5f5c55;text-shadow:0 1px 2px rgba(255,255,255,.8)}
#app.inverted .hud .stats b{color:#141413}
#app.inverted .hud .stats .fw{color:#9a6512} #app.inverted .hud .stats .bk{color:#22708f}
#app.inverted .axes{color:#5f5c55}
#app.inverted .axes circle{fill:#141413}
#app.inverted .brush{border-color:rgba(20,20,19,.55);box-shadow:0 0 0 1px rgba(255,255,255,.55)}
#app.inverted .brush.hit{border-color:var(--amber);box-shadow:0 0 0 1px rgba(255,255,255,.55),0 0 14px rgba(226,165,66,.55)}

.pane{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;width:var(--pane-w);max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--pane);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.pane-head{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 12px;border-bottom:1px solid var(--line)}
.spacer{flex:1}
.pane-body{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.pane-foot{padding:9px 12px 11px;border-top:1px solid var(--line);font:400 10.5px/1.6 var(--f-mono);color:var(--ink-dim);display:flex;flex-wrap:wrap;gap:2px 10px}
.pane-foot kbd{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--field)}

.btn{font:500 12px/1 var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:7px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-dim)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:600;min-width:72px;justify-content:center}
.btn.icon{padding:6px 8px}
.btn svg{width:12px;height:12px;fill:currentColor}
.btn.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em}
.reveal{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}

:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

details.folder{border-bottom:1px solid var(--line)}
details.folder:last-child{border-bottom:0}
details.folder>summary{list-style:none;cursor:pointer;padding:10px 12px;font:600 11.5px/1 var(--f-display);letter-spacing:.17em;text-transform:uppercase;color:var(--ink-dim);display:flex;align-items:center;gap:9px;user-select:none}
details.folder>summary::-webkit-details-marker{display:none}
details.folder>summary::before{content:"";border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details.folder[open]>summary{color:var(--ink)}
details.folder[open]>summary::before{transform:rotate(90deg)}
details.folder>summary .tag{margin-left:auto;font:400 10px/1 var(--f-mono);letter-spacing:0;text-transform:none;color:var(--ink-dim)}
.folder-body{padding:0 12px 13px;display:flex;flex-direction:column;gap:8px}

.row{display:grid;grid-template-columns:104px minmax(0,1fr) 66px;align-items:center;gap:8px;min-height:24px}
.row.two{grid-template-columns:104px minmax(0,1fr)}
.row>label,.row>.lab{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>label.code,.row>.lab.code{font-family:var(--f-mono);font-size:12px;color:var(--amber)}
.row.main>label{font-weight:600}

input[type=number],select{width:100%;box-sizing:border-box;font:400 11.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:3px;padding:5px 6px}
input[type=number]{text-align:right;-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:0;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--amber) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4.5px;border-radius:50%;background:var(--ink);border:0;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--amber)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:0}

.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:0}
.seg button{flex:1;min-width:0;font:500 11.5px/1 var(--f-body);padding:6px 4px;background:var(--field);color:var(--ink-dim);border:0;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--amber-wash);color:var(--amber)}
.seg button:focus-visible{outline-offset:-2px}

.ramp{height:9px;border-radius:2px;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink-dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

.ramp-ed{display:flex;flex-direction:column;gap:6px}
.ramp-title{font-size:12.5px;color:var(--ink)}
.ramp-track{position:relative;padding-bottom:14px}
.ramp-bar{height:18px;border-radius:3px;border:1px solid var(--line);cursor:copy}
.ramp-keys{position:absolute;left:0;right:0;bottom:0;height:13px}
.ramp-key{position:absolute;top:0;width:12px;height:13px;margin-left:-6px;padding:0;border:0;background:transparent;cursor:ew-resize;touch-action:none}
.ramp-key::before{content:"";position:absolute;left:5px;top:-4px;width:2px;height:4px;background:var(--ink-dim)}
.ramp-key::after{content:"";position:absolute;left:1px;top:1px;width:8px;height:8px;border-radius:2px;background:var(--c);border:1px solid var(--ink-dim)}
.ramp-key.sel::before{background:var(--amber)}
.ramp-key.sel::after{border:2px solid var(--amber);left:0;top:0}
.ramp-key:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.ramp-tools{display:grid;grid-template-columns:34px 62px 28px minmax(0,1fr) auto;gap:6px;align-items:center}
.ramp-tools input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--line);border-radius:3px;background:var(--field);cursor:pointer}
.ramp-tools select{font-family:var(--f-body);font-size:12px;padding:5px 4px;min-width:0}
.ramp-tools .btn{padding:6px 8px;justify-content:center}
.ramp-tools .btn:disabled{opacity:.4;cursor:default}

.brush{position:absolute;left:0;top:0;border-radius:50%;border:1px solid rgba(232,229,221,.6);box-shadow:0 0 0 1px rgba(0,0,0,.45);transform:translate(-50%,-50%);pointer-events:none;transition:border-color .15s,box-shadow .15s}
.brush.hit{border-color:var(--amber);box-shadow:0 0 0 1px rgba(0,0,0,.45),0 0 14px rgba(226,165,66,.55)}
.guide-box{display:flex;flex-direction:column;gap:7px}
#guidePreview{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:3px;background:var(--ground)}
.guide-empty{font-size:12px;line-height:1.45;color:var(--ink-dim);border:1px dashed var(--line);border-radius:3px;padding:10px}
.guide-row{display:flex;align-items:center;gap:6px;min-width:0}
.guide-name{flex:1;min-width:0;font:400 11px/1.3 var(--f-mono);color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guide-row .btn:disabled{opacity:.4;cursor:default}
.preset-box{display:flex;flex-direction:column;gap:8px}
.preset-save{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.preset-save input{min-width:0;font:400 12.5px/1 var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:3px;padding:6px 8px}
.preset-save input::placeholder{color:var(--ink-dim)}
.preset-save .btn.primary{min-width:0;padding:6px 12px}
.preset-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;max-height:212px;overflow-y:auto;overscroll-behavior:contain}
.preset-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:5px;padding:3px 4px 3px 0;border-bottom:1px solid var(--line)}
.preset-item:last-child{border-bottom:0}
.preset-item.active{background:var(--amber-wash)}
.preset-item.active .preset-load{color:var(--amber)}
.preset-load{border:0;background:none;cursor:pointer;text-align:left;padding:6px 8px;font:500 12.5px/1.2 var(--f-body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.preset-load:hover{color:var(--amber)}
.preset-load:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.preset-date{font:400 10.5px/1 var(--f-mono);color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.preset-item .btn{padding:4px 7px;font-size:11px}
.preset-item .btn.danger{color:var(--both);border-color:var(--both)}
.preset-tools{display:flex;gap:6px;flex-wrap:wrap}
.preset-tools .btn:disabled{opacity:.4;cursor:default}
.preset-empty{font-size:12px;line-height:1.45;color:var(--ink-dim);padding:9px 10px}
.hud h1 .ver{margin-left:7px;font:500 10.5px/1 var(--f-mono);letter-spacing:.04em;color:var(--amber);text-transform:none;vertical-align:2px}

.formula{margin:0;font:400 11px/1.65 var(--f-mono);color:var(--ink-dim);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:4px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.formula em{font-style:normal;color:var(--amber)}
.formula .fw{color:var(--amber)} .formula .bk{color:var(--back)}
.note{font-size:11.5px;line-height:1.45;color:var(--ink-dim)}
.note.warn{color:var(--both)}

.sheet{width:100%;border-collapse:collapse;font:400 11.5px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.sheet th,.sheet td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.sheet th:first-child,.sheet td:first-child{text-align:left;color:var(--amber)}
.sheet thead th{font:600 10px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.sheet tr:last-child td{border-bottom:0}
.sheet-wrap{overflow-x:auto}

.code-sheet{position:absolute;left:16px;top:calc(78px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));right:calc(var(--pane-w) + 32px);display:flex;flex-direction:column;background:var(--pane);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.45);min-width:0}
#app.pane-hidden .code-sheet{right:16px}
.code-head{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.code-head .seg{flex:0 1 430px}
.code-note{margin:0;padding:9px 14px;font-size:12px;line-height:1.45;color:var(--ink-dim);border-bottom:1px solid var(--line);max-width:80ch}
pre.code{margin:0;flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;font:400 11.5px/1.6 var(--f-mono);color:var(--ink);white-space:pre;tab-size:2}
pre.code .cm{color:#c99a52}

.fatal{position:absolute;inset:0;display:grid;place-items:center;padding:24px 16px;background:var(--ground)}
.fatal div{max-width:440px;font-size:14px;line-height:1.55;color:var(--ink)}
.fatal h2{margin:0 0 8px;font:600 16px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}

@media (max-width:640px){
  .pane{top:auto;left:16px;right:16px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:54%}
  .row{grid-template-columns:96px minmax(0,1fr) 60px}
  .row.two{grid-template-columns:96px minmax(0,1fr)}
  .pane-foot{display:none}
  .code-sheet,#app.pane-hidden .code-sheet{right:16px;top:calc(56px + env(safe-area-inset-top,0px))}
  .axes{display:none}
}
@media (prefers-reduced-motion:reduce){details.folder>summary::before,.brush{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="Particle view, seen like Houdini's Top view: X to the right, Z down. Click to randomize N inside the circle, shift-click to inspect a point."></canvas>
  <div class="brush" id="brush" hidden aria-hidden="true"></div>

  <div class="hud">
    <h1>Nearpoint Angle Solver<span class="ver">v002</span></h1>
    <div class="stats" id="stats">starting…</div>
  </div>

  <div class="axes" aria-hidden="true">
    <svg viewBox="0 0 44 44"><path d="M4 4H38" stroke="var(--axis-x)" stroke-width="2" fill="none"/><path d="M38 0l6 4-6 4z" fill="var(--axis-x)"/><path d="M4 4V38" stroke="var(--axis-z)" stroke-width="2" fill="none"/><path d="M0 38l4 6 4-6z" fill="var(--axis-z)"/><circle cx="4" cy="4" r="2.5" fill="var(--ink)"/></svg>
    <span>X →&nbsp; Z ↓&nbsp; top view</span>
  </div>

  <aside class="pane" id="pane" aria-label="Simulation parameters">
    <div class="pane-head">
      <button class="btn primary" id="play" type="button"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg><span>Pause</span></button>
      <button class="btn" id="stepBtn" type="button" title="One solver step (.)">Step</button>
      <button class="btn" id="resetBtn" type="button" title="Back to the grid (R)">Reset</button>
      <span class="spacer"></span>
      <button class="btn mono" id="codeBtn" type="button" title="Show the GLSL (G)" aria-expanded="false">GLSL</button>
      <button class="btn icon" id="fitBtn" type="button" title="Fit view (F)">Fit</button>
      <button class="btn icon" id="hideBtn" type="button" title="Hide parameters (H)" aria-label="Hide parameters"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.3 1.2 6 4.9l3.7-3.7 1.1 1.1L7.1 6l3.7 3.7-1.1 1.1L6 7.1l-3.7 3.7-1.1-1.1L4.9 6 1.2 2.3z"/></svg></button>
    </div>
    <div class="pane-body" id="params"></div>
    <div class="pane-foot">
      <span><kbd>Space</kbd> play</span><span><kbd>.</kbd> step</span><span><kbd>R</kbd> reset</span><span><kbd>G</kbd> GLSL</span><span><kbd>I</kbd> invert</span><span><kbd>H</kbd> hide</span><span><kbd>F</kbd> fit</span>
      <span>click: randomize N · shift-click: inspect · drag: pan · wheel: zoom</span>
    </div>
  </aside>
  <button class="btn reveal" id="revealBtn" type="button" hidden>Parameters</button>

  <section class="code-sheet" id="codeSheet" hidden aria-label="GLSL source">
    <div class="code-head">
      <div class="seg" id="codeTabs" role="group" aria-label="Shader"></div>
      <span class="spacer"></span>
      <button class="btn" id="copyBtn" type="button">Copy</button>
      <button class="btn icon" id="codeClose" type="button" aria-label="Close GLSL"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.3 1.2 6 4.9l3.7-3.7 1.1 1.1L7.1 6l3.7 3.7-1.1 1.1L6 7.1l-3.7 3.7-1.1-1.1L4.9 6 1.2 2.3z"/></svg></button>
    </div>
    <p class="code-note" id="codeNote"></p>
    <pre class="code" id="codeText" tabindex="0"></pre>
  </section>

  <div class="fatal" id="fatal" hidden><div><h2>Can't start the simulation</h2><p id="fatalMsg"></p></div></div>
</div>

<script>
'use strict';
(() => {
const $ = s => document.querySelector(s);
const canvas = $('#view');
function fatal(msg){ $('#fatal').hidden = false; $('#fatalMsg').textContent = msg; }

const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:false, stencil:false, premultipliedAlpha:false, powerPreference:'high-performance' });
if (!gl) { fatal('This browser has WebGL2 turned off or unavailable. Current Chrome, Edge, Firefox and Safari (15+) all support it; check that hardware acceleration is on.'); return; }
if (!gl.getExtension('EXT_color_buffer_float')) { fatal('This GPU/browser cannot render to floating-point textures (EXT_color_buffer_float), which the solver needs to hold P and N. Try a desktop browser with hardware acceleration on.'); return; }

/* ------------------------------------------------------------------ parameters (defaults = the VEX) */
const PRESETS = {
  Ember:      ['#2b2140','#6b2550','#c43c3c','#f08a3e','#ffe2a3'],
  'Infra-red':['#2a1a6e','#8c2981','#de4968','#fe9f6d','#fcfdbf'],
  Glacier:    ['#13324a','#1d6f8a','#43b3b0','#a9e4d3','#f3fff9'],
  Spectral:   ['#3d3bb8','#2e8fd1','#3cc4a0','#c9d65a','#f39b3a','#d93b3b'],
  Cyclic:     ['#f0b04a','#e0605a','#8a63d2','#3d8fd6','#3fbfa0','#f0b04a'],   // same colour at both ends, so @N has no seam
  Bone:       ['#3a3733','#f4efe6'],
};
const preset = name => PRESETS[name].map((c, i, a) => ({ p: i / (a.length - 1), c }));
const P = {
  playing: true,
  angle: 70,            // if(angle>70)
  count: 100000,        // grid points (rounded to a square grid)
  speed: 1,             // solver steps per displayed frame
  low: 45.2,            // if(angle<45.2)
  radius: 0.6,          // nearpoints(0, @P, .6, 2)
  lerpHigh: 0.032,      // lerp(@N, nN, 0.032)
  lerpLow: 0.0325,      // lerp(@N, nN, 0.0325)
  move: 0.008,          // @P -= / += @N*0.008
  lone: 'vex',          // nothing in radius: 'vex' = what VEX does, 'keep' = leave the point alone
  kMode: 'fit',         // 'near': npt = nearpoints(0, @P, .6, 2)[1];  'fit': k = int(fit(@pd, a, b, 2, 2 + extra)), npt = nearpoints(0, @P, .6, k)[-1]
  kA: 40, kB: 60, kExtra: 10,
  pdRadius: 0.1,        // pd = len(nearpoints(0, @P, chf("pd_radius"), chi("pd_max_num")))
  pdMax: 60,

      case gl.SAMPLER_2D: gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, v); gl.uniform1i(u.loc, unit++); break;
      case gl.INT: case gl.BOOL: gl.uniform1i(u.loc, v); break;
      case gl.FLOAT: gl.uniform1f(u.loc, v); break;
      case gl.FLOAT_VEC2: gl.uniform2fv(u.loc, v); break;
      case gl.FLOAT_VEC3: gl.uniform3fv(u.loc, v); break;
      case gl.FLOAT_VEC4: gl.uniform4fv(u.loc, v); break;

const FS_INIT = `
// Emit: one fragment per point. Runs once when the sim starts (and on Reset).
// Points live in the XZ plane at y = 0, so state is stored 2D: (P.x, P.z, N.x, N.z).
uniform int uCount, uTexW, uCols, uRows, uSeed;
uniform float uSize;
layout(location=0) out vec4 oState;
layout(location=1) out vec4 oInfo;
layout(location=2) out vec4 oAttr;
layout(location=3) out vec4 oSpeed;  // @speed = 1: every point starts at full speed

uint hash(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float rand01(uint x){ return float(hash(x) >> 8) * (1.0 / 16777216.0); }   // 0 <= r < 1, like VEX rand()

void main(){
  ivec2 fc = ivec2(gl_FragCoord.xy);
  int ptnum = fc.y * uTexW + fc.x;
  oInfo = vec4(0.0); oAttr = vec4(0.0); oSpeed = vec4(1.0);
  if (ptnum >= uCount) { oState = vec4(0.0); return; }

  // Grid in the XZ plane like a Grid SOP: cols along X, rows along Z, centred on the origin
  int col = ptnum % uCols, row = ptnum / uCols;
  vec2 P = (vec2(col, row) / vec2(uCols - 1, uRows - 1) - 0.5) * uSize;    // (P.x, P.z)

  // @N = fit01(rand(@ptnum), -{1,1,1}, {1,1,1});
  uint s = uint(ptnum) * 3u + uint(uSeed) * 0x9e3779b9u;
  vec3 N = mix(vec3(-1.0), vec3(1.0), vec3(rand01(s), rand01(s + 1u), rand01(s + 2u)));
  // @N.y = 0;
  N.y = 0.0;
  // @N = normalize(@N);
  N = length(N) > 0.0 ? normalize(N) : vec3(0.0);

  oState = vec4(P, N.x, N.z);
}`;

// Shared by the bucket pass and the step: which grid cell a position falls in, and its hash bucket.
const COMMON = `
uniform float uH;        // cell size of the search grid
uniform int uTabMask;    // bucket count - 1 (power of two)
ivec2 at(int k, int w, int sh){ return ivec2(k & (w - 1), k >> sh); }      // 1D index -> texel
ivec2 cellOf(vec2 p){ return ivec2(floor(clamp(p / uH, vec2(-1e9), vec2(1e9)))) + 1073741824; }
int bucketOf(ivec2 c){                                                    // infinite grid, hashed into a fixed table
  uint h = uint(c.x) * 73856093u ^ uint(c.y) * 19349663u;
  h ^= h >> 16; h *= 0x7feb352du; h ^= h >> 15; h *= 0x846ca68bu; h ^= h >> 16;
  return int(h & uint(uTabMask));
}
ivec2 ringCell(int k, int j){                                             // j-th cell on the square ring at distance k
  if (k == 0) return ivec2(0);
  int side = j / (2 * k), t = j - side * 2 * k;
  if (side == 0) return ivec2(-k + t, -k);
  if (side == 1) return ivec2(k, -k + t);
  if (side == 2) return ivec2(k - t, k);
  return ivec2(-k, k - t);
}
`;

// The wrangle, run on every point each step. All points read the previous step, like a SOP solver.
const FS_SIM = `
// One solver step: the wrangle, run on every point. Every point reads the previous
// step's geometry and writes the next one, the same as an Attribute Wrangle in a SOP Solver.
#define MAXRING 64
#define MAXVISIT 2048            // safety cap on points looked at per search (only reached in extreme pile-ups)
#define MAXK 33                  // most neighbours fit mode can collect: k up to 2 + 32
uniform sampler2D uState;    // (P.x, P.z, N.x, N.z) by ptnum: input 0
uniform sampler2D uSorted;   // the same data, sorted by grid bucket
uniform sampler2D uKeys;     // (bucket, ptnum) in sorted order
uniform sampler2D uRange;    // per bucket: [start, end) in the sorted list
uniform int uCount, uTexW, uTexShift, uTabW, uTabShift, uRings, uApply, uLone, uPdMax;
uniform float uRadius, uAngleHi, uAngleLo, uLerpHi, uLerpLo, uMove;
uniform float uPdRadius, uShrink, uShrinkMin, uShrinkMax;
uniform sampler2D uGuideA;   // image: brightness, edge strength, contour direction x coherence (zw)
uniform sampler2D uGuideB;   // image: uphill on blurred edges (xy), uphill on blurred darkness (zw)
uniform int uGuideOn, uGuideSrc;               // source: 0 edges, 1 dark tones, 2 light tones
uniform vec2 uImgHalf, uImgCenter;             // half the image size and its centre, world units (x, z)
uniform float uThr, uSoft, uSteer, uPull;
uniform sampler2D uSpeed;                      // @speed by ptnum (x): 1 at emit, multiplied down in the dark
uniform int uDarkOn;                           // slow in dark on (only acts while the guide is on)
uniform float uMinLum, uMultDark;              // min_lum, mult_in_dark
uniform int uKMode;                            // 0 closest [1], 1 fit by pd [-1]
uniform float uKA, uKB, uKExtra;
layout(location=0) out vec4 oState;
layout(location=1) out vec4 oInfo;   // angle, branch (1 = >hi, 2 = <lo, 3 = both), npt, distance (-1 = nothing in radius)
layout(location=2) out vec4 oAttr;   // pd, pdn, shrink weight, image mask
layout(location=3) out vec4 oSpeed;  // @speed

vec2 safeNormalize(vec2 v){ float l = length(v); return l > 0.0 ? v / l : vec2(0.0); }   // VEX normalize(0) = 0
// Squared distance, in cells, from P to the nearest edge of the cell at offset o from P's own cell (0 for its own and
// touching rows), less a little slack for rounding. Every point in that cell is at least this far from P, so a cell whose
// value is beyond the search radius can be skipped without reading its points: it could not have changed the result.
float nearCells2(ivec2 o, vec2 fP, float slack){
  vec2 g = max(abs(vec2(o)) - mix(1.0 - fP, fP, vec2(greaterThan(o, ivec2(0)))) - slack, 0.0);
  return dot(g, g);
}
float fit01(float v, float a, float b){ return b > a ? clamp((v - a) / (b - a), 0.0, 1.0) : (v >= b ? 1.0 : 0.0); }   // fit(v, a, b, 0, 1)
float sstep(float a, float b, float v){ if (b == a) return v >= a ? 1.0 : 0.0; float t = clamp((v - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }   // smooth(a, b, v); b < a runs backwards

void main(){
  ivec2 fc = ivec2(gl_FragCoord.xy);
  int ptnum = fc.y * uTexW + fc.x;
  if (ptnum >= uCount) { oState = vec4(0.0); oInfo = vec4(0.0); oAttr = vec4(0.0); oSpeed = vec4(1.0); return; }
  vec4 me = texelFetch(uState, fc, 0);
  vec2 P = me.xy, N = me.zw;            // .y of these vec2s is the Z component
  float speed = texelFetch(uSpeed, fc, 0).x;
  bool slow = uDarkOn == 1 && uGuideOn == 1;
  float spd = slow ? speed : 1.0;       // scales every move of @P below

  ivec2 c = cellOf(P);
  vec2 pc = clamp(P / uH, vec2(-1e9), vec2(1e9));
  vec2 fP = pc - floor(pc);                                          // where P sits inside its own cell, 0..1
  float slack = 1e-4 + 1e-6 * max(abs(pc.x), abs(pc.y)), h2 = uH * uH;

  // int pd = len(nearpoints(0, @P, chf("pd_radius"), chi("pd_max_num")));    points within pd_radius, itself included
  // Grid cells are searched in growing square rings; this stops once pd_max_num is reached or the radius is covered.
  float pr2 = uPdRadius >= 0.0 ? uPdRadius * uPdRadius : -1.0;   // a negative radius finds nothing
  int pd = 0, visits = 0;
  for (int k = 0; k <= MAXRING; k++) {
    if (k > uRings || visits > MAXVISIT) break;
    int cells = k == 0 ? 1 : 8 * k;
    for (int j = 0; j < cells; j++) {
      if (visits > MAXVISIT || pd >= uPdMax) break;
      ivec2 o = ringCell(k, j), cc = c + o;
      vec2 se = texelFetch(uRange, at(bucketOf(cc), uTabW, uTabShift), 0).xy;
      if (nearCells2(o, fP, slack) * h2 > pr2) { visits += int(se.y) - int(se.x); continue; }   // nothing in it is within pd_radius
      for (int s = int(se.x); s < int(se.y); s++) {
        if (++visits > MAXVISIT) break;
        vec2 q = texelFetch(uSorted, at(s, uTexW, uTexShift), 0).xy;
        if (cellOf(q) != cc) continue;  // a different cell that shares this hash bucket
        vec2 d = q - P;
        if (dot(d, d) <= pr2) pd++;
      }
    }
    if (pd >= uPdMax || float(k) * uH >= uPdRadius) break;
  }

  // Which neighbour to read:
  //   closest:  int npt = nearpoints(0, @P, .6, 2)[1];
  //   fit:      int k = int(fit(@pd, a, b, 2, 2 + extra));  int npt = nearpoints(0, @P, .6, k)[-1];
  // nearpoints() returns this point first, then the others by distance, so [-1] is the (k-1)th closest
  // other point, or the farthest one inside the radius when fewer are found.
  int K = 1;                                       // how many other points to collect: k - 1
  if (uKMode == 1) K = int(2.0 + uKExtra * fit01(float(pd), uKA, uKB) + 1e-4) - 1;
  bool selfRead = K < 1;                           // k <= 1: nearpoints() returns only this point, so [-1] is itself
  K = clamp(K, 1, MAXK);                           // k tops out at MAXK + 1
  float kd[MAXK];                                  // squared distances, closest first
  int ks[MAXK];                                    // their slots in the sorted list
  int kn = 0;
  float R2 = uRadius >= 0.0 ? uRadius * uRadius : -1.0;
  visits = selfRead ? MAXVISIT + 1 : 0;           // skip the search when the point reads itself
  for (int k = 0; k <= MAXRING; k++) {
    if (k > uRings || visits > MAXVISIT) break;
    int cells = k == 0 ? 1 : 8 * k;
    for (int j = 0; j < cells; j++) {
      if (visits > MAXVISIT) break;
      ivec2 o = ringCell(k, j), cc = c + o;
      vec2 se = texelFetch(uRange, at(bucketOf(cc), uTabW, uTabShift), 0).xy;
      float near2 = nearCells2(o, fP, slack) * h2;
      if (near2 > R2 || (kn == K && near2 > kd[K - 1])) { visits += int(se.y) - int(se.x); continue; }   // every point in it would be skipped below
      for (int s = int(se.x); s < int(se.y); s++) {
        if (++visits > MAXVISIT) break;
        vec2 q = texelFetch(uSorted, at(s, uTexW, uTexShift), 0).xy;
        if (cellOf(q) != cc) continue;
        vec2 d = q - P;
        float d2 = dot(d, d);
        if (d2 > R2 || (kn == K && d2 >= kd[K - 1])) continue;
        if (d2 == 0.0 && int(texelFetch(uKeys, at(s, uTexW, uTexShift), 0).y) == ptnum) continue;  // itself, nearpoints()[0]
        if (kn < K) kn++;                          // insert in distance order, dropping the farthest when full
        int m = kn - 1;
        while (m > 0 && kd[m - 1] > d2) { kd[m] = kd[m - 1]; ks[m] = ks[m - 1]; m--; }

      }
    }
    float reach = float(k) * uH;        // every unvisited point is at least this far away
    if ((kn == K && kd[K - 1] <= reach * reach) || reach >= uRadius) break;
  }

  int npt = -1;
  vec2 nN = N;
  bool rule = true;
  float ndist = -1.0;
  if (selfRead) { npt = ptnum; nN = N; ndist = 0.0; }
  else if (kn > 0) {
    int sl = ks[kn - 1];                   // [1] when k = 2; [-1] in fit mode
    npt = int(texelFetch(uKeys, at(sl, uTexW, uTexShift), 0).y);
    // vector nN = point(0, "N", npt);
    nN = texelFetch(uSorted, at(sl, uTexW, uTexShift), 0).zw;

  } else if (uLone == 0) {
    // Nothing else within the radius, so nearpoints() returns only this point.
    if (uKMode == 1) { npt = ptnum; nN = N; }      // [-1] of that is the point itself
    else {                                          // [1] reads past the end: VEX returns 0, so point 0's N
      npt = 0;
      nN = texelFetch(uState, ivec2(0), 0).zw;
    }
  } else rule = false;                  // "Leave as is": skip the angle rule for this point

  float angle = -1.0;
  int branch = 0;
  if (rule) {
    // float x1 = @N.x; float x2 = nN.x; float y1 = @N.z; float y2 = nN.z;
    float x1 = N.x, x2 = nN.x, y1 = N.y, y2 = nN.y;
    // float dot = x1*x2 + y1*y2;
    float dt = x1 * x2 + y1 * y2;
    // float det = x1*y2 - y1*x2;
    float det = x1 * y2 - y1 * x2;
    // float angle = degrees(atan2(det, dot));
    angle = (dt == 0.0 && det == 0.0) ? 0.0 : degrees(atan(det, dt));
    // angle %= 180.;   VEX % takes the sign of 180, like GLSL mod(): -10 becomes 170
    angle = mod(angle, 180.0);

    // if(angle>70){ @N=lerp(@N,nN,0.032); @N=normalize(@N); @P-=@N*0.008; }
    if (angle > uAngleHi) { N = safeNormalize(mix(N, nN, uLerpHi)); P -= N * uMove * spd; branch |= 1; }
    // if(angle<45.2){ @N=lerp(@N,nN,0.0325); @N=normalize(@N); @P+=@N*0.008; }
    if (angle < uAngleLo) { N = safeNormalize(mix(N, nN, uLerpLo)); P += N * uMove * spd; branch |= 2; }
  }
  // @N = normalize(@N);
  N = safeNormalize(N);

  // Image guide: over the strong parts of the image, turn N along the image's contours
  // and pull P toward them. Does nothing when no image is loaded or the guide is off.
  float mask = 0.0;

    vec2 uv = (P - uImgCenter) / (2.0 * uImgHalf) + 0.5;   // the image's top edge is toward -Z
    if (uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) {

      vec4 B = texture(uGuideB, uv);
      float v = uGuideSrc == 0 ? A.y : (uGuideSrc == 1 ? 1.0 - A.x : A.x);
      // mask = smoothstep(thr, thr + soft, edge or tone)
      mask = sstep(uThr, uThr + uSoft, v);
      // @N = lerp(@N, contour, mask * steer);  weighted by how clearly the contour has one direction
      float coh = length(A.zw);
      if (coh > 1e-4) {
        vec2 t = A.zw / coh;
        if (dot(t, N) < 0.0) t = -t;                 // a contour runs both ways: take the side N already faces
        N = safeNormalize(mix(N, t, mask * uSteer * coh));

    }

  // @pdn = fit(@pd, 1, chi("pd_max_num"), 0, 1);      pd counts the point itself, so 1 means alone
  float pdn = uPdMax > 1 ? clamp(float(pd - 1) / float(uPdMax - 1), 0.0, 1.0) : 0.0;
  // @N += @N * lerp(1, chf("shrink"), fit(@pdn, chf("shrink_pd_min"), chf("shrink_pd_max"), 0, 1));
  float w = fit01(pdn, uShrinkMin, uShrinkMax);
  N += N * mix(1.0, uShrink, w);

  oState = uApply == 1 ? vec4(P, N) : me;
  oInfo = vec4(angle, float(branch), float(npt), ndist);
  oAttr = vec4(float(pd), pdn, w, mask);
  oSpeed = vec4(uApply == 1 ? speed : texelFetch(uSpeed, fc, 0).x, 0.0, 0.0, 0.0);
}`;

layout(location=1) out vec4 oSpeed;

uint hash(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float rand01(uint x){ return float(hash(x) >> 8) * (1.0 / 16777216.0); }

void main(){

  int ptnum = fc.y * uTexW + fc.x;

// Neighbour grid, rebuilt before every step.
const FS_KEY = `
// Pass 1: bucket key of each point (padding slots get a huge key so they sort last)

const SORT_FUSE = 3;

uniform sampler2D uSrc, uAttr; uniform ivec2 uSrcSize; uniform int uFirst, uCount, uTexW;

const VS_POINTS = HDR + `
uniform sampler2D uState, uInfo, uAttr, uRamp;

const FS_POINTS = HDR + `

const VS_MARK = HDR + `
uniform sampler2D uState; uniform int uId, uTexW, uTexShift; uniform vec2 uCam, uScale; uniform float uSize;

let PR;

/* ------------------------------------------------------------------ simulation state */
const S = {
  count: 0, cols: 0, rows: 0, size: 10, total: 0, texW: 0, texH: 0, shift: 0,
  tabW: 0, tabH: 0, tabSize: 0, h: 0.04, rings: 1,
  cur: 0, frame: 0, acc: 0, clicks: 0,
  state: [], speed: [], info: null, attr: null, keys: [], keysFbo: [], simFbo: [], brushFbo: [], sorted: null, sortedFbo: null, range: null, rangeFbo: null,
  reduce: [], counts: null, stats: [0, 0, 0, 0],

  S.attr = texture(texW, texH, 'rgba32f');      // pd, pdn, shrink weight
  S.speed = [texture(texW, texH, 'rg32f'), texture(texW, texH, 'rg32f')];   // @speed, ping-pongs with state

// Search-grid cell: a bit over the starting point spacing, never so small that the larger radius needs more than 48 rings
function updateSearchGrid(){

function emit(){

function solve(apply){

    uImgHalf: imgHalf(), uImgCenter: imgCenter(), uThr: P.thr, uSoft: P.soft, uSteer: P.steer, uPull: P.pull,
    uSpeed: S.speed[S.cur], uDarkOn: P.darkSlow === 'on' ? 1 : 0, uMinLum: P.minLum, uMultDark: P.multDark,

}

// Counts for the HUD, from the latest step. Run only when the HUD reads them, not after every step.
function reduceStats(){
  const { texW, texH, count } = S;

// Click: new random N inside a circle of P.brush screen pixels around (cx, cy)
function randomizeAt(cx, cy){
  const r = canvas.getBoundingClientRect();
  const wx = cam.x + ((cx - r.left) * dpr - S.fw / 2) / cam.ppu, wz = cam.y + ((cy - r.top) * dpr - S.fh / 2) / cam.ppu;

/* ------------------------------------------------------------------ colour */
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };

const statsBuf = gl.createBuffer(), statsOut = new Float32Array(4);

/* ------------------------------------------------------------------ main loop */
let resetPending = false, stepOnce = false, tick = 0;
function frame(now){
  requestAnimationFrame(frame);

  let n = 0;

  else if (stepOnce) { n = 1; changed = true; }

  } else {                      // otherwise: ask every 12 frames, show the counts when they arrive
    const got = pollStats();

    if (statsWanted && requestStats()) statsWanted = false;
    if (due || got) updateHud();

  const posOf = clientX => { const r = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (clientX - r.left) / r.width)); };
  const tidy = v => Math.round(v * 1000) / 1000;
  function syncTools(){
    const k = keys()[rampSel]; color.value = k.c; pos.value = k.p.toFixed(3); del.disabled = keys().length <= 2;
  }
  function sync(){
    const k = keys(); rampSel = Math.min(rampSel, k.length - 1);

  wrap.sync = sync;
  return wrap;
}

function makeRow(it){
  if (it.type === 'rampedit') { rampEd = makeRampEditor(); rows.push({ it, row: rampEd }); return rampEd; }
  if (it.type === 'note') { const r = h('div', { class: 'note' }, it.text); rows.push({ it, row: r }); return r; }
  if (it.type === 'legend') {
    const chip = (c, t) => h('span', {}, h('i', { style: `background:${c}` }), t);
    const r = h('div', { class: 'legend' }, chip(RULE_COL.fwd, 'angle < lower'), chip(RULE_COL.back, 'angle > upper'), chip(RULE_COL.both, 'both'), chip(RULE_COL.idle, 'neither'));
    rows.push({ it, row: r }); return r;
  }
  const key = it.k, id = 'p-' + it.k;
  const label = h('label', { for: id, class: it.code ? 'code' : '' }, it.label);
  if (it.hint) label.title = it.hint;
  let row;
  if (!it.type) {
    // The slider covers a useful range; the number box takes any value inside the hard limits, which only
    // exist where a value would break the sim. Typing a value past the slider's ends stretches the slider to it.
    const toS = v => it.log ? Math.log10(v) : v;
    const fromS = v => it.log ? (it.round ? it.round(10 ** v) : 10 ** v) : v;
    const fmt = v => {
      if (it.k === 'count') return (+v).toFixed(0);
      const s = (+v).toFixed(decimals(it.step));
      return +s === +v ? s : String(+(+v).toPrecision(7));   // show typed values in full
    };
    const sl = h('input', { type: 'range', id, min: toS(it.min), max: toS(it.max), step: it.log ? 0.001 : it.step, value: toS(P[key]) });
    const num = h('input', { type: 'number', id: 'n-' + it.k, step: it.step, value: fmt(P[key]), 'aria-label': it.label + ' value' });
    if (it.hint) { sl.title = it.hint; num.title = it.hint; }
    const lo = it.hardMin ?? -1e9, hi = it.hardMax ?? 1e9;
    const stretch = v => { const s = toS(v); if (s < +sl.min) sl.min = s; if (s > +sl.max) sl.max = s; };
    sl.addEventListener('input', () => { P[key] = fromS(+sl.value); num.value = fmt(P[key]); sliderFill(sl); onChange(it, false); });
    sl.addEventListener('change', () => onChange(it, true));

      P[key] = v; num.value = fmt(v); stretch(v); sl.value = toS(v); sliderFill(sl); onChange(it, true);
    });
    stretch(P[key]); sliderFill(sl);
    row = h('div', { class: 'row' + (it.main ? ' main' : '') }, label, sl, num);
    row._sync = () => { stretch(P[key]); sl.value = toS(P[key]); num.value = fmt(P[key]); sliderFill(sl); };
  } else if (it.type === 'seg') {
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': it.label });
    const btns = it.options.map(([v, t]) => {
      const b = h('button', { type: 'button', 'aria-pressed': String(P[key] === v) }, t);
      b.addEventListener('click', () => { P[key] = v; btns.forEach((x, i) => x.setAttribute('aria-pressed', String(it.options[i][0] === v))); onChange(it, true); });
      seg.append(b); return b;
    });
    row = h('div', { class: 'row two' }, h('span', { class: 'lab' + (it.code ? ' code' : ''), title: it.hint || '' }, it.label), seg);
    row._sync = () => btns.forEach((x, i) => x.setAttribute('aria-pressed', String(it.options[i][0] === P[key])));
  }
  rows.push({ it, row });
  return row;
}

const formulaEls = {};

/* ------------------------------------------------------------------ presets */
// A preset is every setting in P except the transport state and the loaded image.
// On claude.ai presets go to the viewer's own private store (db: data/users/<id>/presets/items/<preset>),
// which follows them to any device they sign in on. Where that is not available (signed out, the GitHub
// copy of the page) they go to this browser's local storage. Export / Import moves them as .json files.
const PRESET_SKIP = new Set(['playing', 'marker']);
const PRESET_APP = 'nearpoint-angle-solver';
const PRESET_LOCAL_KEY = 'nearpoint-angle-solver.presets.v1';
const PS = { mode: 'pending', list: [], col: null, unsub: null, active: null, dl: null };
let ITEM_BY_KEY = null;
const itemFor = k => {
  if (!ITEM_BY_KEY) { ITEM_BY_KEY = {}; GROUPS.forEach(g => g.items.forEach(it => { if (it.k) ITEM_BY_KEY[it.k] = it; })); }
  return ITEM_BY_KEY[k];
};
const clone = v => JSON.parse(JSON.stringify(v));
function currentParams(){
  const o = {};
  for (const k in DEFAULTS) if (!PRESET_SKIP.has(k)) o[k] = clone(P[k]);
  return o;
}
// Only known settings, of the right kind and inside the hard limits; a missing one takes its default,
// so an imported or older preset can never push the sim into values that break it
function cleanRamps(v){
  const out = {};

    const r = v && Array.isArray(v[m]) ? v[m].filter(k => k && typeof k.p === 'number' && isFinite(k.p) && typeof k.c === 'string' && /^#[0-9a-f]{6}$/i.test(k.c))
      .map(k => ({ p: Math.min(1, Math.max(0, k.p)), c: k.c.toLowerCase() })) : null;
    out[m] = r && r.length >= 2 ? r : clone(DEFAULTS.ramps[m]);
  }
  return out;
}
function cleanParams(src){
  const out = {};
  for (const k in DEFAULTS) {
    if (PRESET_SKIP.has(k)) continue;
    const d = DEFAULTS[k], v = src ? src[k] : undefined, it = itemFor(k);
    if (k === 'ramps') out.ramps = cleanRamps(v);
    else if (typeof d === 'number') {
      let n = typeof v === 'number' && isFinite(v) ? v : d;
      if (it) { n = Math.min(it.hardMax ?? 1e9, Math.max(it.hardMin ?? -1e9, n)); if (it.int) n = Math.round(n); }
      out[k] = n;
    } else if (typeof d === 'string') out[k] = typeof v === 'string' && (!it || !it.options || it.options.some(o => o[0] === v)) ? v : d;

// Set every control from a preset. Each changed setting goes through onChange, exactly as if it had been
// changed by hand; a different particle count, grid size or seed restarts the sim.
function applyParams(params){
  const p = cleanParams(params), changed = Object.keys(p).filter(k => JSON.stringify(p[k]) !== JSON.stringify(P[k]));
  const regrid = ['count', 'size', 'seed'].some(k => changed.includes(k));
  Object.assign(P, p);
  rows.forEach(({ row }) => { if (row._sync) row._sync(); });
  for (const k of changed) { const it = itemFor(k); if (it) onChange(it, true); }
  S.flashPending = false;
  rampSel = 0; if (rampEd) rampEd.sync(); else buildRamp();
  updateSearchGrid(); updateFormula(); refreshRows(); sizeBrush(); drawPreview();
  S.needClear = true;
  if (regrid) resetPending = true; else if (!P.playing) S.infoDirty = true;
  updateHud();
  return regrid;
}

function localPresets(){ try { const v = JSON.parse(localStorage.getItem(PRESET_LOCAL_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function storeLocalPresets(list){ try { localStorage.setItem(PRESET_LOCAL_KEY, JSON.stringify(list)); return true; } catch (e) { return false; } }
function presetsLocal(msg){
  if (PS.unsub) { PS.unsub(); PS.unsub = null; }
  PS.mode = 'local'; PS.col = null; PS.list = localPresets();
  renderPresets();
  if (msg) presetStatus(msg);
}
async function initPresets(){
  renderPresets();
  const use = window.claude && typeof window.claude.use === 'function' ? n => window.claude.use(n).catch(() => null) : null;
  if (!use) { presetsLocal(''); return; }
  const [db, user, dl] = await Promise.all([use('db'), use('user'), use('downloads')]);
  PS.dl = dl;
  const uid = user ? await user.id() : null;
  if (!db || !uid) { presetsLocal(''); return; }
  try {
    PS.col = db.doc('data/users/' + uid + '/presets').collection('items');
    PS.mode = 'account';
    PS.unsub = PS.col.onSnapshot(snap => {
      PS.list = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.kind === 'preset' && typeof x.name === 'string');
      renderPresets();
    }, e => presetsLocal(e && e.code === 'revoked' ? '' : 'Presets could not be read from your account in this view, so they are kept in this browser.'));
    renderPresets();
  } catch (e) { presetsLocal(''); }
}
// Write one preset (a new one, or over `id`); resolves its id. Falls back to this browser if the account refuses.
async function putPreset(name, params, id){
  const now = Date.now(), prev = id ? PS.list.find(x => x.id === id) : null;
  const body = { kind: 'preset', app: PRESET_APP, v: 1, name, params, created: prev && prev.created ? prev.created : now, updated: now };
  if (PS.mode === 'account') {
    try { const ref = id ? PS.col.doc(id) : PS.col.doc(); await ref.set(body); return ref.id; }
    catch (e) {
      if (e && e.code === 'quota_exceeded') throw new Error('Your preset store is full. Delete some presets, then try again.');
      presetsLocal('Presets could not be saved to your account in this view, so they are kept in this browser.');
    }
  }
  const list = localPresets(), nid = id || ('p' + now.toString(36) + Math.random().toString(36).slice(2, 7));
  const i = list.findIndex(x => x.id === nid), item = { id: nid, ...body };
  if (i >= 0) list[i] = item; else list.push(item);
  if (!storeLocalPresets(list)) throw new Error('This browser would not store the preset (a private window, or site data is blocked). Use Export to keep it as a file.');
  PS.list = list;
  return nid;
}
async function savePreset(){
  const input = document.getElementById('presetName'), name = (input.value || '').trim().slice(0, 80);
  if (!name) { presetStatus('Type a name for these settings first.'); input.focus(); return; }
  const same = PS.list.find(x => x.name.toLowerCase() === name.toLowerCase());
  try {
    PS.active = await putPreset(name, currentParams(), same ? same.id : null);
    presetStatus(`${same ? 'Updated' : 'Saved'} “${name}”.`);
  } catch (e) { presetStatus(e.message); }
  renderPresets();
}
function loadPreset(p){
  const regrid = applyParams(p.params);
  PS.active = p.id;
  const input = document.getElementById('presetName'); if (input) input.value = p.name;
  presetStatus(`Loaded “${p.name}”.` + (regrid ? ' Particle count, grid size or seed differ, so the sim restarted.' : ''));
  renderPresets();
}
async function deletePreset(p){
  if (PS.mode === 'account') {
    try { await PS.col.doc(p.id).delete(); }
    catch (e) { presetStatus('That preset could not be deleted just now. Try again in a moment.'); return; }
  } else { PS.list = localPresets().filter(x => x.id !== p.id); storeLocalPresets(PS.list); }
  if (PS.active === p.id) PS.active = null;
  const input = document.getElementById('presetName'); if (input && input.value.trim().toLowerCase() === p.name.toLowerCase()) input.value = '';
  presetStatus(`Deleted “${p.name}”.`);
  renderPresets();
}
const presetFile = items => JSON.stringify({ app: PRESET_APP, v: 1, presets: items.map(p => ({ name: p.name, params: p.params })) }, null, 2);
const safeName = s => (s.replace(/[^\w\- .()]+/g, '_').replace(/^[ .]+|[ .]+$/g, '') || 'preset').slice(0, 80);
async function exportPresets(items, filename){
  const data = presetFile(items);
  if (PS.dl) {
    try { await PS.dl.save({ filename, data }); presetStatus(`Saved ${filename}.`); }
    catch (e) { if (!e || e.code !== 'declined') presetStatus(e && e.code === 'rate_limited' ? 'A save prompt is already open.' : 'The file could not be saved in this view.'); }
    return;
  }
  if (!window.claude) {                    // a copy of the page outside claude.ai: an ordinary download works
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = filename;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    presetStatus(`Saved ${filename}.`);
    return;
  }
  try { await navigator.clipboard.writeText(data); presetStatus('Files cannot be saved in this view, so the preset was copied as JSON instead. Paste it into a .json file to keep it.'); }
  catch (e) { presetStatus('Files cannot be saved in this view.'); }
}
async function importPresets(file){
  if (!file) return;
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { presetStatus(`“${file.name}” is not a preset file (it is not valid JSON).`); return; }
  let items = Array.isArray(obj && obj.presets) ? obj.presets
    : obj && obj.params && typeof obj.params === 'object' ? [obj]
    : obj && typeof obj === 'object' && ('angle' in obj || 'radius' in obj) ? [{ name: file.name.replace(/\.json$/i, ''), params: obj }] : [];
  items = items.filter(x => x && typeof x === 'object' && x.params && typeof x.params === 'object').slice(0, 200);
  if (!items.length) { presetStatus(`“${file.name}” has no presets in it.`); return; }
  const taken = new Set(PS.list.map(x => x.name.toLowerCase()));
  let n = 0, last = null;
  try {
    for (const it of items) {
      const base = (String(it.name || '').trim() || file.name.replace(/\.json$/i, '') || 'Imported').slice(0, 72);
      let name = base;
      for (let k = 2; taken.has(name.toLowerCase()); k++) name = `${base} (${k})`;
      taken.add(name.toLowerCase());
      last = await putPreset(name, cleanParams(it.params), null);
      n++;
    }
  } catch (e) { presetStatus(e.message); renderPresets(); return; }
  PS.active = last;
  presetStatus(n === 1 ? 'Imported 1 preset. Click its name to load it.' : `Imported ${n} presets. Click a name to load it.`);
  renderPresets();
}
function presetStatus(msg){ const el = document.getElementById('presetStatus'); if (el) { el.textContent = msg; el.hidden = !msg; } }
function fmtWhen(t){
  if (!t) return '';
  const d = new Date(t), now = new Date();
  return d.toDateString() === now.toDateString() ? d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })
    : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', ...(d.getFullYear() !== now.getFullYear() ? { year: 'numeric' } : {}) });
}
function renderPresets(){
  const box = document.getElementById('presetList'), where = document.getElementById('presetWhere'), all = document.getElementById('presetExportAll');
  if (!box) return;
  where.textContent = PS.mode === 'account' ? 'Saved to your claude.ai account: private to you, on any device you sign in on.'
    : PS.mode === 'local' ? 'Saved in this browser only. Export a preset to keep it as a file or move it to another device.' : 'Connecting…';
  const list = [...PS.list].sort((a, b) => (b.updated || 0) - (a.updated || 0));
  all.disabled = !list.length;
  box.replaceChildren();
  if (!list.length) { box.append(h('div', { class: 'preset-empty' }, PS.mode === 'pending' ? 'Loading presets…' : 'No presets yet. Name the current settings and press Save.')); return; }
  for (const p of list) {
    const load = h('button', { type: 'button', class: 'preset-load', title: 'Load these settings' }, p.name);
    load.addEventListener('click', () => loadPreset(p));
    const ex = h('button', { type: 'button', class: 'btn', title: 'Save this preset as a .json file' }, 'Export');
    ex.addEventListener('click', () => exportPresets([p], safeName(p.name) + '.json'));
    const del = h('button', { type: 'button', class: 'btn', 'aria-label': `Delete ${p.name}` }, 'Delete');
    let armed = null;
    del.addEventListener('click', () => {
      if (!armed) { del.textContent = 'Sure?'; del.classList.add('danger'); armed = setTimeout(() => { armed = null; del.textContent = 'Delete'; del.classList.remove('danger'); }, 3000); return; }
      clearTimeout(armed); deletePreset(p);
    });
    box.append(h('div', { class: 'preset-item' + (p.id === PS.active ? ' active' : '') }, load, h('span', { class: 'preset-date' }, fmtWhen(p.updated)), ex, del));
  }
}
function buildPresetBox(){
  const name = h('input', { type: 'text', id: 'presetName', maxlength: '80', placeholder: 'Name these settings', 'aria-label': 'Preset name', autocomplete: 'off' });
  const save = h('button', { class: 'btn primary', type: 'button', id: 'presetSave' }, 'Save');
  name.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); savePreset(); } });
  save.addEventListener('click', savePreset);
  const file = h('input', { type: 'file', id: 'presetFile', accept: 'application/json,.json', hidden: '' });
  file.addEventListener('change', () => { importPresets(file.files[0]); file.value = ''; });
  const imp = h('button', { class: 'btn', type: 'button', id: 'presetImport' }, 'Import…');
  imp.addEventListener('click', () => file.click());
  const all = h('button', { class: 'btn', type: 'button', id: 'presetExportAll' }, 'Export all');
  all.addEventListener('click', () => exportPresets([...PS.list].sort((a, b) => (b.updated || 0) - (a.updated || 0)), 'nearpoint-presets.json'));
  return h('div', { class: 'preset-box' },
    h('div', { class: 'preset-save' }, name, save),
    h('div', { class: 'preset-list', id: 'presetList' }),
    h('div', { class: 'preset-tools' }, imp, all, file),
    h('div', { class: 'note', id: 'presetStatus', role: 'status', 'aria-live': 'polite', hidden: '' }),
    h('div', { class: 'note', id: 'presetWhere' }));
}

/* GLSL viewer */
const CODE = [
  { id: 'step', label: 'Step', note: 'Runs every solver step, one fragment per point. This is the wrangle: pd, then which neighbour to read (the closest, or the kth by pd), the angle and the two branches, then the image guide and slow in dark (@speed), pdn and the @N update. The image is turned into the two guide textures in JavaScript when it loads (blur, edge strength, contour direction). The VEX lines are kept as comments above their GLSL.',
    src: () => HDR + COMMON + FS_SIM },
  { id: 'emit', label: 'Emit (once)', note: 'Runs once when the sim starts and on Reset: grid positions and the random N. GPU random numbers differ from Houdini’s rand(), so the exact pattern differs; the distribution is the same.',
    src: () => HDR + FS_INIT },
  { id: 'click', label: 'Click', note: 'Runs when you click in the view: points inside the circle get a new random N, made the same way as at emit, and @speed goes back to 1.',
    src: () => HDR + FS_BRUSH },
  { id: 'grid', label: 'Neighbour grid', note: 'Stands in for nearpoints()’ lookup structure. Four small steps run before every solver step, with the same header and helpers as the Step tab: bucket each point by grid cell; sort by bucket (a bitonic sort that runs up to three layers of the network per pass, 55 passes for 100k points instead of 153; the code is generated per pass shape, one is shown); record where each bucket starts and ends (drawn as points into the bucket table); then copy P and N into sorted order.',
    src: () => [FS_KEY, sortSrc(SORT_FUSE, Array.from({ length: SORT_FUSE }, (_, i) => [SORT_FUSE - 1 - i, SORT_FUSE])), VS_RANGE, FS_RANGE, FS_REORDER].map(s => s.trim()).join('\n\n') },
];
let codeTab = 'step';
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const highlight = src => src.split('\n').map(line => { const i = line.indexOf('//'); return i < 0 ? esc(line) : esc(line.slice(0, i)) + '<span class="cm">' + esc(line.slice(i)) + '</span>'; }).join('\n');
const codeBtns = CODE.map(c => {
  const b = h('button', { type: 'button', 'aria-pressed': String(c.id === codeTab) }, c.label);
  b.addEventListener('click', () => { codeTab = c.id; showCode(); });
  $('#codeTabs').append(b); return b;
});
function showCode(){
  const c = CODE.find(x => x.id === codeTab);
  codeBtns.forEach((b, i) => b.setAttribute('aria-pressed', String(CODE[i].id === codeTab)));
  $('#codeNote').textContent = c.note;
  $('#codeText').innerHTML = highlight(c.src().trim());
  $('#codeText').scrollTop = 0;
}
function setCode(open){ $('#codeSheet').hidden = !open; $('#codeBtn').setAttribute('aria-expanded', String(open)); if (open) showCode(); }
$('#codeBtn').addEventListener('click', () => setCode($('#codeSheet').hidden));
$('#codeClose').addEventListener('click', () => setCode(false));
$('#copyBtn').addEventListener('click', () => {
  const txt = CODE.find(x => x.id === codeTab).src().trim(), btn = $('#copyBtn');
  const done = t => { btn.textContent = t; setTimeout(() => { btn.textContent = 'Copy'; }, 1400); };
  const select = () => { const r = document.createRange(); r.selectNodeContents($('#codeText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done('Selected'); };
  try { navigator.clipboard.writeText(txt).then(() => done('Copied'), select); } catch (e) { select(); }
});

/* transport */
function setPlaying(on){
  P.playing = on;
  const b = $('#play');
  b.querySelector('span').textContent = on ? 'Pause' : 'Play';
  b.querySelector('svg').innerHTML = on ? '<path d="M2 1h3v10H2zM7 1h3v10H7z"/>' : '<path d="M2 1l9 5-9 5z"/>';
}
$('#play').addEventListener('click', () => setPlaying(!P.playing));
$('#stepBtn').addEventListener('click', () => { setPlaying(false); stepOnce = true; });
$('#resetBtn').addEventListener('click', () => { resetPending = true; });
$('#fitBtn').addEventListener('click', () => fitView());
function setPane(show){ $('#pane').hidden = !show; $('#revealBtn').hidden = show; $('#app').classList.toggle('pane-hidden', !show); if (show && inspectShown()) readInspect(); }
$('#hideBtn').addEventListener('click', () => setPane(false));
$('#revealBtn').addEventListener('click', () => setPane(true));
let lastInvert = 'on';   // what I toggles back to
function setInvert(v){
  if (v !== 'off') lastInvert = v;
  P.invert = v;
  $('#app').classList.toggle('inverted', v !== 'off');
  rows.forEach(({ it, row }) => { if (it.k === 'invert') row._sync(); });
}

addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.key === 'Escape' && !$('#codeSheet').hidden) setCode(false);
  else if (e.code === 'Space') { e.preventDefault(); setPlaying(!P.playing); }
  else if (e.key === '.') { setPlaying(false); stepOnce = true; }
  else if (e.key === 'r' || e.key === 'R') resetPending = true;
  else if (e.key === 'h' || e.key === 'H') setPane($('#pane').hidden);
  else if (e.key === 'f' || e.key === 'F') fitView();
  else if (e.key === 'g' || e.key === 'G') setCode($('#codeSheet').hidden);
  else if (e.key === 'i' || e.key === 'I') setInvert(P.invert === 'off' ? lastInvert : 'off');
});

/* pan / zoom / click to randomize N / shift-click to inspect */
const brushEl = $('#brush');
function sizeBrush(){ brushEl.style.width = brushEl.style.height = 2 * P.brush + 'px'; }
function placeBrush(e){ const r = canvas.getBoundingClientRect(); brushEl.style.left = (e.clientX - r.left) + 'px'; brushEl.style.top = (e.clientY - r.top) + 'px'; }
function flashBrush(e){
  placeBrush(e); brushEl.hidden = false; brushEl.classList.add('hit');
  setTimeout(() => { brushEl.classList.remove('hit'); if (e.pointerType !== 'mouse') brushEl.hidden = true; }, 220);
}
let drag = null;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }; });
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { brushEl.hidden = e.shiftKey || !!(drag && drag.moved); placeBrush(e); }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; canvas.classList.add('dragging'); brushEl.hidden = true; }
  if (drag.moved) { cam.x = drag.cx - dx * dpr / cam.ppu; cam.y = drag.cy - dy * dpr / cam.ppu; S.needClear = true; }
});
canvas.addEventListener('pointerup', e => {
  if (drag && !drag.moved) {
    if (e.shiftKey || e.altKey) pick(e.clientX, e.clientY);
    else { randomizeAt(e.clientX, e.clientY); flashBrush(e); }
  }
  drag = null; canvas.classList.remove('dragging');
});
canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('dragging'); });
canvas.addEventListener('pointerleave', () => { brushEl.hidden = true; });
canvas.addEventListener('dblclick', fitView);
// Drop an image file anywhere on the page, or paste one
const dragHasFile = e => [...(e.dataTransfer?.types || [])].some(t => t === 'Files' || t === 'text/uri-list');
addEventListener('dragover', e => { if (dragHasFile(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
addEventListener('drop', e => {
  if (!dragHasFile(e)) return;
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) { loadGuideFile(f); return; }
  const uri = (e.dataTransfer.getData('text/uri-list') || '').split(/\r?\n/).find(l => l && l[0] !== '#') || '';
  if (/^data:image\//i.test(uri)) loadGuide(uri, 'dropped image', false);
  else if (uri) guideError('Images dragged from a web page cannot be read here. Save the image, then drop or load the file.');
});
addEventListener('paste', e => {
  const items = [...(e.clipboardData?.items || [])].filter(it => it.kind === 'file');
  const f = items.map(it => it.getAsFile()).find(Boolean);
  if (!f) return;                       // plain text pastes into the number boxes as usual
  e.preventDefault();
  loadGuideFile(f);
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const px = (e.clientX - r.left) * dpr - S.fw / 2, py = (e.clientY - r.top) * dpr - S.fh / 2;
  const wx = cam.x + px / cam.ppu, wz = cam.y + py / cam.ppu;
  cam.ppu = Math.min(1e6, Math.max(1e-3, cam.ppu * Math.exp(-e.deltaY * 0.0015)));
  cam.x = wx - px / cam.ppu; cam.y = wz - py / cam.ppu;
  S.needClear = true;
}, { passive: false });

function pick(cx, cy){
  const r = canvas.getBoundingClientRect();
  const all = readTex(S.state[S.cur], 0, 0, S.texW, S.texH);
  let best = -1, bd = 14 * 14;
  for (let i = 0; i < S.count; i++) {
    const px = r.left + (S.fw / 2 + (all[i*4] - cam.x) * cam.ppu) / dpr;
    const py = r.top + (S.fh / 2 + (all[i*4+1] - cam.y) * cam.ppu) / dpr;
    const d = (px - cx) ** 2 + (py - cy) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0) {
    inspectId = best; const n = $('#inspectId'); if (n) n.value = best;
    if (P.marker !== 'on') { P.marker = 'on'; rows.forEach(({ it, row }) => { if (it.k === 'marker') row._sync(); }); }
    const insp = [...document.querySelectorAll('details.folder')].pop(); if (insp) insp.open = true;
    readInspect();
  }
}

/* ------------------------------------------------------------------ boot */
// default guide image: the portrait, 512 px grayscale JPEG
const DEFAULT_IMAGE = '';   // this copy ships without a default image: load one with the button, or drop or paste it
buildUI();
if (rampEd) rampEd.sync(); else buildRamp();
sizeBrush();
if (innerWidth < 640) setPane(false);
resize();
try { emit(); } catch (e) { fatal('Could not set up the GPU buffers: ' + e.message); return; }
fitView();
if (DEFAULT_IMAGE) loadGuide(DEFAULT_IMAGE, 'portrait.jpg', false);
initPresets();
readStats(); readInspect(); updateHud();
requestAnimationFrame(frame);

// handle for scripted testing from the console
window.__sim = { P, S, G, emit, solve, readTex, render, setPlaying, updateSearchGrid, randomizeAt, cam };
})();
</script>
